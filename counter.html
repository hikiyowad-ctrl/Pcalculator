<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    background-color: #0a0a0a;
    color: #00ff00;
    height: 100vh;
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #1a1a1a;
    padding: 15px;
    border: 1px solid #00ff00;
    border-radius: 10px;
}

.mode-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.mode-btn {
    flex: 1;
    padding: 10px 5px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 35px;
}

.mode-btn.active {
    background: #00ff00;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 10px #00ff00;
}

/* ゲームカウンター */
.game-section {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.game-label {
    font-weight: 600;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    font-size: 16px;
    white-space: nowrap;
}

.game-input {
    width: 80px;
    padding: 8px;
    border: 1px solid #00ff00;
    border-radius: 5px;
    text-align: center;
    font-size: 16px;
    background: #000000;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 500;
}

.game-input:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 10px #00ff00;
}

/* 丸いカウントボタン */
.circle-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.circle-btn-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
}

/* カウントと分数の表示（ボタンの上） */
.count-display {
    font-size: 14px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 8px;
    font-weight: 600;
}

.rate-display {
    font-size: 12px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    opacity: 0.8;
    margin-bottom: 8px;
}

.circle-btn {
    width: 50px;
    height: 50px;
    border: 2px solid;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.1s ease;
    position: relative;
    overflow: hidden;
}

/* ボタン押下時のアニメーション */
.circle-btn.pressed {
    transform: scale(0.85);
}

.circle-btn::after {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border: 2px solid transparent;
    border-radius: 50%;
    transition: all 0.2s ease;
}

.circle-btn.pressed::after {
    border-color: #ffffff;
    box-shadow: 0 0 15px #ffffff;
}

/* 各ボタンの色 - 内側も同じ色で塗りつぶし */
.circle-btn-1 {
    border-color: #ff0000;
    background: #ff0000;
    color: #000000;
}

.circle-btn-1.pressed::after {
    border-color: #ffffff;
    box-shadow: 0 0 20px #ffffff;
}

.circle-btn-2 {
    border-color: #00ff00;
    background: #00ff00;
    color: #000000;
}

.circle-btn-2.pressed::after {
    border-color: #ffffff;
    box-shadow: 0 0 20px #ffffff;
}

.circle-btn-3 {
    border-color: #0000ff;
    background: #0000ff;
    color: #ffffff;
}

.circle-btn-3.pressed::after {
    border-color: #ffffff;
    box-shadow: 0 0 20px #ffffff;
}

.circle-btn-4 {
    border-color: #ffff00;
    background: #ffff00;
    color: #000000;
}

.circle-btn-4.pressed::after {
    border-color: #ffffff;
    box-shadow: 0 0 20px #ffffff;
}

/* 制御ボタン */
.control-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.control-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

.control-btn.active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

.control-btn.pressed {
    transform: scale(0.95);
    background: #00ff00;
    color: #000000;
}

/* 数字入力時のスピンボタンを非表示 */
.game-input::-webkit-outer-spin-button,
.game-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.game-input[type=number] {
    -moz-appearance: textfield;
}

/* 横向き用スタイル */
@media (orientation: landscape) {
    .container {
        max-width: 600px;
        margin: 0 auto;
    }
}

/* 縦向き用スタイル */
@media (orientation: portrait) {
    .container {
        max-width: 100%;
    }
}

/* 確認ダイアログ用のオーバーレイ */
.confirm-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.confirm-dialog {
    background: #1a1a1a;
    border: 2px solid #00ff00;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    max-width: 300px;
    width: 90%;
}

.confirm-message {
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 20px;
    font-size: 16px;
}

.confirm-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.confirm-btn {
    padding: 10px 20px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
    flex: 1;
}

.confirm-btn.yes {
    background: #004400;
    border-color: #00ff00;
}

.confirm-btn.yes:active {
    background: #00ff00;
    color: #000000;
}

.confirm-btn.no {
    background: #440000;
    border-color: #ff0000;
}

.confirm-btn.no:active {
    background: #ff0000;
    color: #000000;
}
</style>
</head>
<body>
<div class="container">
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="A">MODE A</button>
        <button class="mode-btn" data-mode="B">MODE B</button>
        <button class="mode-btn" data-mode="C">MODE C</button>
    </div>

    <!-- ゲームカウンター -->
    <div class="game-section">
        <span class="game-label">GAME</span>
        <input type="number" class="game-input" id="totalCount" value="0" min="0">
    </div>

    <!-- 丸いカウントボタン -->
    <div class="circle-buttons">
        <div class="circle-btn-container">
            <div class="count-display" id="countDisplay1">0</div>
            <div class="rate-display" id="rateDisplay1">1/0.00</div>
            <button class="circle-btn circle-btn-1" data-index="0"></button>
        </div>
        <div class="circle-btn-container">
            <div class="count-display" id="countDisplay2">0</div>
            <div class="rate-display" id="rateDisplay2">1/0.00</div>
            <button class="circle-btn circle-btn-2" data-index="1"></button>
        </div>
        <div class="circle-btn-container">
            <div class="count-display" id="countDisplay3">0</div>
            <div class="rate-display" id="rateDisplay3">1/0.00</div>
            <button class="circle-btn circle-btn-3" data-index="2"></button>
        </div>
        <div class="circle-btn-container">
            <div class="count-display" id="countDisplay4">0</div>
            <div class="rate-display" id="rateDisplay4">1/0.00</div>
            <button class="circle-btn circle-btn-4" data-index="3"></button>
        </div>
    </div>

    <!-- 制御ボタン -->
    <div class="control-buttons">
        <button class="control-btn active" id="incrementBtn">増加モード</button>
        <button class="control-btn" id="decrementBtn">減少モード</button>
        <button class="control-btn" id="resetBtn">リセット</button>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        this.isIncrementMode = true;
        
        // 各モードと各カウントボタンの値を保持
        this.counts = {
            'A': [0, 0, 0, 0],
            'B': [0, 0, 0, 0],
            'C': [0, 0, 0, 0]
        };
        
        // 各モードごとのG数を保持
        this.totalGames = {
            'A': 0,
            'B': 0,
            'C': 0
        };
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
        this.updateDisplay();
    }

    initializeElements() {
        this.totalCountElement = document.getElementById('totalCount');
        this.modeButtons = document.querySelectorAll('.mode-btn');
        this.circleButtons = document.querySelectorAll('.circle-btn');
        this.incrementBtn = document.getElementById('incrementBtn');
        this.decrementBtn = document.getElementById('decrementBtn');
        this.resetBtn = document.getElementById('resetBtn');
        
        // カウント表示要素
        this.countDisplays = [
            document.getElementById('countDisplay1'),
            document.getElementById('countDisplay2'),
            document.getElementById('countDisplay3'),
            document.getElementById('countDisplay4')
        ];
        
        // レート表示要素
        this.rateDisplays = [
            document.getElementById('rateDisplay1'),
            document.getElementById('rateDisplay2'),
            document.getElementById('rateDisplay3'),
            document.getElementById('rateDisplay4')
        ];
    }

    setupEventListeners() {
        // モードボタン
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        // 丸いカウントボタン
        this.circleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
        });

        // 制御ボタン
        [this.incrementBtn, this.decrementBtn, this.resetBtn].forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    if (btn === this.incrementBtn) {
                        this.setIncrementMode(true);
                    } else if (btn === this.decrementBtn) {
                        this.setIncrementMode(false);
                    } else if (btn === this.resetBtn) {
                        this.showResetConfirmation();
                    }
                });
            });
        });

        // 総G数入力の変更を監視
        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
            this.updateDisplay();
        });
    }

    handleButtonPress(button, callback) {
        // ボタン押下時の視覚的フィードバック
        button.classList.add('pressed');
        setTimeout(() => {
            button.classList.remove('pressed');
        }, 150);
        
        // コールバック実行
        setTimeout(callback, 50);
    }

    setMode(mode) {
        this.currentMode = mode;

        // アクティブなモードボタンのスタイル更新
        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 現在のモードのG数を表示
        this.totalCountElement.value = this.totalGames[this.currentMode];
        
        this.updateDisplay();
    }

    setIncrementMode(isIncrement) {
        this.isIncrementMode = isIncrement;
        
        // ボタンのスタイル更新
        if (isIncrement) {
            this.incrementBtn.classList.add('active');
            this.decrementBtn.classList.remove('active');
        } else {
            this.incrementBtn.classList.remove('active');
            this.decrementBtn.classList.add('active');
        }
    }

    handleCountButton(buttonIndex) {
        const currentCounts = this.counts[this.currentMode];
        
        if (this.isIncrementMode) {
            currentCounts[buttonIndex]++;
        } else {
            if (currentCounts[buttonIndex] > 0) {
                currentCounts[buttonIndex]--;
            }
        }
        
        this.updateDisplay();
    }

    showResetConfirmation() {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        
        const dialog = document.createElement('div');
        dialog.className = 'confirm-dialog';
        
        const message = document.createElement('div');
        message.className = 'confirm-message';
        message.textContent = '全て消去しますがよろしいですか？';
        
        const buttons = document.createElement('div');
        buttons.className = 'confirm-buttons';
        
        const yesBtn = document.createElement('button');
        yesBtn.className = 'confirm-btn yes';
        yesBtn.textContent = 'はい';
        yesBtn.onclick = () => {
            this.resetCurrentMode();
            document.body.removeChild(overlay);
        };
        
        const noBtn = document.createElement('button');
        noBtn.className = 'confirm-btn no';
        noBtn.textContent = 'いいえ';
        noBtn.onclick = () => {
            document.body.removeChild(overlay);
        };
        
        buttons.appendChild(yesBtn);
        buttons.appendChild(noBtn);
        
        dialog.appendChild(message);
        dialog.appendChild(buttons);
        overlay.appendChild(dialog);
        
        document.body.appendChild(overlay);
    }

    resetCurrentMode() {
        this.counts[this.currentMode] = [0, 0, 0, 0];
        this.updateDisplay();
    }

    updateTotalGames() {
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames[this.currentMode] = value;
        this.totalCountElement.value = value;
        this.updateDisplay();
    }

    updateDisplay() {
        const currentCounts = this.counts[this.currentMode];
        const currentTotalGames = this.totalGames[this.currentMode];
        
        // 各カウントボタンの表示を更新
        this.countDisplays.forEach((element, index) => {
            element.textContent = currentCounts[index];
        });
        
        // レート表示を更新
        this.rateDisplays.forEach((element, index) => {
            const count = currentCounts[index];
            let rate = "1/0.00";
            
            if (count > 0 && currentTotalGames > 0) {
                const calculatedRate = currentTotalGames / count;
                rate = `1/${calculatedRate.toFixed(2)}`;
            } else if (count > 0) {
                rate = "1/0.00";
            }
            
            element.textContent = rate;
        });
    }
}

// アプリケーションの初期化
document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
</body>
</html>
