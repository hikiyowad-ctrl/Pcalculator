<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
}

body {
    font-family: 'Rajdhani', sans-serif;
    margin: 0;
    padding: 10px;
    background-color: #0a0a0a;
    touch-action: pan-y;
    color: #00ff00;
    height: 100vh;
    overflow: hidden;
    /* 常に横向き表示 */
    transform: rotate(-90deg);
    transform-origin: center center;
    width: 100vh;
    height: 100vw;
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -50vw;
    margin-left: -50vh;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
    border: 1px solid #00ff00;
}

.header {
    text-align: center;
    margin-bottom: 15px;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
    letter-spacing: 2px;
    flex-shrink: 0;
}

.mode-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.mode-btn {
    flex: 1;
    padding: 12px 5px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 50px;
}

.mode-btn:hover {
    background: #003300;
}

.mode-btn.active {
    background: #00ff00;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 10px #00ff00;
}

.main-content {
    display: flex;
    gap: 15px;
    flex: 1;
    min-height: 0;
}

.left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.counter-display {
    text-align: center;
    background: #000000;
    border-radius: 10px;
    padding: 20px;
    border: 2px solid #00ff00;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.counter-value {
    font-size: 48px;
    font-weight: 700;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    text-shadow: 0 0 10px #00ff00;
    letter-spacing: 2px;
}

.counter-label {
    font-size: 14px;
    color: #00ff00;
    margin-top: 5px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    opacity: 0.8;
}

.control-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.control-btn {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 60px;
}

.increment-btn {
    background: #004400;
    color: #00ff00;
    border: 2px solid #00ff00;
}

.increment-btn:active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

.decrement-btn {
    background: #440000;
    color: #ff0000;
    border: 2px solid #ff0000;
}

.decrement-btn:active {
    background: #ff0000;
    color: #000000;
    box-shadow: 0 0 15px #ff0000;
}

.reset-btn {
    background: #444400;
    color: #ffff00;
    border: 2px solid #ffff00;
}

.reset-btn:active {
    background: #ffff00;
    color: #000000;
    box-shadow: 0 0 15px #ffff00;
}

.stats {
    background: #000000;
    padding: 15px;
    border-radius: 5px;
    border: 1px solid #00ff00;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.game-counter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.stat-label {
    font-weight: 600;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    font-size: 16px;
}

.input-field {
    width: 120px;
    padding: 10px;
    border: 1px solid #00ff00;
    border-radius: 5px;
    text-align: center;
    font-size: 18px;
    background: #000000;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 500;
}

.input-field:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 10px #00ff00;
}

/* 数字入力時のスピンボタンを非表示 */
.input-field::-webkit-outer-spin-button,
.input-field::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.input-field[type=number] {
    -moz-appearance: textfield;
}

/* スマホの横向き/縦向きに関係なく横向き表示 */
@media (max-width: 768px) {
    body {
        transform: rotate(-90deg);
        transform-origin: center center;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -50vw;
        margin-left: -50vh;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">個人Gm</div>
    
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="A">MODE A</button>
        <button class="mode-btn" data-mode="B">MODE B</button>
        <button class="mode-btn" data-mode="C">MODE C</button>
        <button class="mode-btn" data-mode="D">MODE D</button>
        <button class="mode-btn" data-mode="E">MODE E</button>
        <button class="mode-btn" data-mode="F">MODE F</button>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <div class="counter-display">
                <div class="counter-value" id="currentCount">0</div>
                <div class="counter-label" id="currentModeLabel">MODE A のカウント</div>
            </div>

            <div class="control-buttons">
                <button class="control-btn increment-btn" id="incrementBtn">+</button>
                <button class="control-btn decrement-btn" id="decrementBtn">-</button>
                <button class="control-btn reset-btn" id="resetBtn">リセット</button>
            </div>
        </div>

        <div class="stats">
            <div class="game-counter">
                <span class="stat-label">GAME</span>
                <input type="number" class="input-field" id="totalCount" value="0" min="0">
            </div>
            
            <!-- 統計表示は削除 -->
        </div>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        // 各小役ごとに独立したカウントを保持
        this.counts = {
            'A': 0,
            'B': 0,
            'C': 0,
            'D': 0,
            'E': 0,
            'F': 0
        };
        
        this.totalGames = 0;
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
    }

    initializeElements() {
        this.currentCountElement = document.getElementById('currentCount');
        this.currentModeLabel = document.getElementById('currentModeLabel');
        this.totalCountElement = document.getElementById('totalCount');
        this.incrementBtn = document.getElementById('incrementBtn');
        this.decrementBtn = document.getElementById('decrementBtn');
        this.resetBtn = document.getElementById('resetBtn');
        this.modeButtons = document.querySelectorAll('.mode-btn');
    }

    setupEventListeners() {
        // モードボタン
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        // インクリメントボタン
        this.incrementBtn.addEventListener('click', () => {
            this.increment();
        });

        // デクリメントボタン
        this.decrementBtn.addEventListener('click', () => {
            this.decrement();
        });

        // リセットボタン
        this.resetBtn.addEventListener('click', () => {
            this.resetCurrent();
        });

        // 総G数入力の変更を監視
        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
        });

        // タッチイベント（スマホ対応）
        this.incrementBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.increment();
        });

        this.decrementBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.decrement();
        });

        this.resetBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.resetCurrent();
        });
    }

    setMode(mode) {
        this.currentMode = mode;

        // アクティブなモードボタンのスタイル更新
        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 現在のモードのカウントを表示
        this.updateDisplay();
        this.currentModeLabel.textContent = `MODE ${mode} のカウント`;
    }

    increment() {
        this.counts[this.currentMode]++;
        this.updateDisplay();
    }

    decrement() {
        if (this.counts[this.currentMode] > 0) {
            this.counts[this.currentMode]--;
            this.updateDisplay();
        }
    }

    resetCurrent() {
        this.counts[this.currentMode] = 0;
        this.updateDisplay();
    }

    updateDisplay() {
        this.currentCountElement.textContent = this.counts[this.currentMode];
    }

    updateTotalGames() {
        // 入力値のバリデーション
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames = value;
        this.totalCountElement.value = value;
    }
}

// アプリケーションの初期化
document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
</body>
</html>
