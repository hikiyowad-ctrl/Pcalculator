<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【仕事量計算】パチスロツール集 トップページ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            min-height: 100vh;
            color: #333;
            text-align: center;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* パチンコ風ヘッダー */
        .header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 25px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.3);
            border: 3px solid #f1c40f;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e74c3c, #f1c40f, #3498db, #27ae60, #9b59b6, #e74c3c);
            background-size: 200% 100%;
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: #f1c40f;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* ツールメニュー */
        .tool-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .tool-link {
            padding: 20px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            color: #2c3e50;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 3px solid #3498db;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2);
            position: relative;
            overflow: hidden;
        }

        .tool-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .tool-link:hover::before {
            left: 100%;
        }

        .tool-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
            border-color: #e74c3c;
        }

        /* 各ツールの個別カラー */
        .tool-link:nth-child(1) {
            border-color: #27ae60;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2);
        }

        .tool-link:nth-child(1):hover {
            border-color: #e74c3c;
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }

        .tool-link:nth-child(2) {
            border-color: #e74c3c;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.2);
        }

        .tool-link:nth-child(2):hover {
            border-color: #3498db;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.3);
        }

        .tool-link:nth-child(3) {
            border-color: #9b59b6;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.2);
        }

        .tool-link:nth-child(3):hover {
            border-color: #e74c3c;
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.3);
        }

        /* 説明文 */
        .description {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #f1c40f;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #2c3e50;
        }

        /* フッターリンク */
        .footer-links {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #bdc3c7;
        }

        .footer-links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #e74c3c;
            transition: width 0.3s ease;
        }

        .footer-links a:hover {
            color: #e74c3c;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        /* レスポンシブデザイン */
        @media (max-width: 768px) {
            .main-container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .tool-link {
                padding: 18px 20px;
                font-size: 1.1rem;
            }

            .description {
                padding: 20px;
                font-size: 1rem;
            }

            .footer-links a {
                display: block;
                margin: 10px 0;
            }

            .footer-links {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .tool-link {
                padding: 15px 18px;
                font-size: 1rem;
            }

            .header {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- パチンコ風ヘッダー -->
        <div class="header">
            <h1>🎰 パチスロ計算ツール集 🎰</h1>
            <div class="subtitle">収支・仕事量計算ツール</div>
        </div>

        <!-- ツールメニュー -->
        <div class="tool-menu">
            <a href="./counter.html" class="tool-link">
                🎯 小役カウンター
            </a>
            
            <a href="./pachinko_calc.html" class="tool-link">
                🎰 パチンコ仕事量・期待値計算ツール
            </a>
            
            <a href="slot_calc.html" class="tool-link">
                💰 スロット仕事量ツール
            </a>
        </div>

        <!-- 説明文 -->
        <div class="description">
            <p>パチンコ・スロットの効率的な遊技をサポートする計算ツール集です。</p>
            <p>仕事量計算、期待値分析、小役カウントなど、勝率向上に役立つ機能を提供しています。</p>
        </div>

        <!-- フッターリンク -->
        <div class="footer-links">
            <a href="index.html">トップページ</a>
            <a href="privacy.html">プライバシーポリシー</a>
            <a href="contact.html">お問い合わせ</a>
            <a href="disclaimer.html">免責事項・利用規約</a>
        </div>
    </div>
</body>
</html>
