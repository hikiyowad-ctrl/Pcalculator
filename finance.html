            // イベントリスナー設定
            setupEventListeners() {
                console.log('イベントリスナー設定開始');
                
                // ハンバーガーメニュー
                document.getElementById('menu-toggle').addEventListener('click', () => {
                    this.openMenu();
                });

                document.getElementById('close-menu').addEventListener('click', () => {
                    this.closeMenu();
                });

                // メニュー項目
                document.getElementById('go-to-top').addEventListener('click', () => {
                    this.goToTopPage();
                    this.closeMenu();
                });

                document.getElementById('show-yearly-stats').addEventListener('click', () => {
                    this.showYearlyStats();
                    this.closeMenu();
                });

                document.getElementById('show-lifetime-stats').addEventListener('click', () => {
                    this.showLifetimeStats();
                    this.closeMenu();
                });

                document.getElementById('show-shop-stats').addEventListener('click', () => {
                    this.showShopStats();
                    this.closeMenu();
                });

                document.getElementById('show-machine-stats').addEventListener('click', () => {
                    this.showMachineStats();
                    this.closeMenu();
                });

                document.getElementById('export-backup').addEventListener('click', () => {
                    this.exportBackup();
                    this.closeMenu();
                });

                document.getElementById('import-backup').addEventListener('click', () => {
                    this.importBackup();
                    this.closeMenu();
                });

                document.getElementById('show-current-month').addEventListener('click', () => {
                    this.currentDate = new Date();
                    this.currentDate.setDate(1);
                    this.renderCalendar();
                    this.closeMenu();
                });

                document.getElementById('customize-theme').addEventListener('click', () => {
                    this.toggleThemeCustomizer();
                    this.closeMenu();
                });

                // メニュー外クリックで閉じる
                document.addEventListener('click', (e) => {
                    const sideMenu = document.getElementById('side-menu');
                    const menuToggle = document.getElementById('menu-toggle');
                    if (!sideMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        this.closeMenu();
                    }
                });

                // テーマ関連のイベントリスナー
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    this.toggleThemeCustomizer();
                });

                document.getElementById('save-theme').addEventListener('click', () => {
                    this.applyCustomTheme();
                    this.toggleThemeCustomizer();
                });

                document.getElementById('reset-theme').addEventListener('click', () => {
                    this.applyTheme('default');
                    this.toggleThemeCustomizer();
                });

                // プリセットテーマのクリックイベント
                document.querySelectorAll('.theme-preset').forEach(preset => {
                    preset.addEventListener('click', () => {
                        const themeName = preset.dataset.theme;
                        this.applyTheme(themeName);
                    });
                });

                // カレンダー背景画像のイベントリスナー - 大幅に拡張
                document.getElementById('bg-image-select').addEventListener('click', () => {
                    document.getElementById('bg-image-input').click();
                });

                document.getElementById('bg-image-input').addEventListener('change', (e) => {
                    this.handleBackgroundImageUpload(e);
                });

                document.getElementById('bg-opacity-slider').addEventListener('input', (e) => {
                    const opacity = parseInt(e.target.value);
                    this.updateBackgroundOpacity(opacity);
                });

                document.getElementById('bg-scale-slider').addEventListener('input', (e) => {
                    const scale = parseInt(e.target.value);
                    this.updateBackgroundScale(scale);
                });

                // 位置調整ボタン
                document.querySelectorAll('.position-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const position = e.target.dataset.position;
                        this.updateBackgroundPosition(position);
                    });
                });

                // 背景設定リセット
                document.getElementById('reset-bg-btn').addEventListener('click', () => {
                    if (confirm('背景設定をデフォルト値にリセットしますか？')) {
                        this.resetBackgroundSettings();
                    }
                });

                // 背景削除
                document.getElementById('remove-bg-btn').addEventListener('click', () => {
                    if (confirm('背景画像を削除しますか？')) {
                        this.removeCalendarBackground();
                    }
                });

                // 統計モーダルを閉じる
                document.getElementById('close-stats').addEventListener('click', () => {
                    document.getElementById('stats-modal').style.display = 'none';
                });

                // 月選択
                const monthPickerModal = document.getElementById('month-picker-modal');
                document.getElementById('current-month').addEventListener('click', () => {
                    monthPickerModal.style.display = 'flex';
                });

                document.getElementById('cancel-month-picker').addEventListener('click', () => {
                    monthPickerModal.style.display = 'none';
                });

                document.getElementById('confirm-month-picker').addEventListener('click', () => {
                    const year = parseInt(document.getElementById('year-select').value);
                    const month = parseInt(document.getElementById('month-select').value);
                    
                    this.currentDate = new Date(year, month, 1);
                    this.selectedDate = null;
                    this.renderCalendar();
                    document.getElementById('day-details').innerHTML = '';
                    monthPickerModal.style.display = 'none';
                });

                // 月移動
                document.getElementById('prev-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.selectedDate = null;
                    this.renderCalendar();
                    document.getElementById('day-details').innerHTML = '';
                });

                document.getElementById('next-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.selectedDate = null;
                    this.renderCalendar();
                    document.getElementById('day-details').innerHTML = '';
                });

                // データ修復
                document.getElementById('cleanup-data').addEventListener('click', () => {
                    if (confirm('全データをスキャンしてエラーデータを修復しますか？')) {
                        const cleanedCount = this.cleanupErrorData();
                        this.renderCalendar();
                        if (this.selectedDate) {
                            const dateStr = this.formatDate(this.selectedDate);
                            this.showDayDetails(dateStr);
                        }
                        alert(`データ修復が完了しました（${cleanedCount}件のエラーデータを削除）`);
                    }
                });

                // サンプルデータ追加
                document.getElementById('add-sample-data').addEventListener('click', () => {
                    if (confirm('サンプルデータを追加しますか？\n（現在のデータは上書きされます）')) {
                        this.addSampleData();
                    }
                });

                // 取引追加・編集
                const modal = document.getElementById('transaction-modal');
                const addBtn = document.getElementById('add-transaction');
                const cancelBtn = document.getElementById('cancel-btn');
                const form = document.getElementById('transaction-form');

                addBtn.addEventListener('click', () => {
                    const today = this.formatDate(new Date());
                    document.getElementById('transaction-modal-title').textContent = '投資取引を追加';
                    document.getElementById('edit-transaction-id').value = '';
                    document.getElementById('transaction-date').value = today;
                    document.getElementById('investment-amount').value = '';
                    document.getElementById('return-amount').value = '';
                    document.getElementById('machine-name').value = '';
                    document.getElementById('shop-name').value = '';
                    modal.style.display = 'flex';
                });

                cancelBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                    form.reset();
                });

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const investmentAmount = document.getElementById('investment-amount').value === '' ? 0 : 
                        parseInt(document.getElementById('investment-amount').value);
                    const returnAmount = document.getElementById('return-amount').value === '' ? 0 : 
                        parseInt(document.getElementById('return-amount').value);
                    const machineName = document.getElementById('machine-name').value || '';
                    const shopName = document.getElementById('shop-name').value || '';
                    
                    if (!Number.isFinite(investmentAmount) || investmentAmount < 0) {
                        alert('投資金額は0以上の数値を入力してください');
                        return;
                    }
                    
                    if (!Number.isFinite(returnAmount) || returnAmount < 0) {
                        alert('回収金額は0以上の数値を入力してください');
                        return;
                    }

                    this.saveTransaction(investmentAmount, returnAmount, machineName, shopName);
                    modal.style.display = 'none';
                    form.reset();
                    this.renderCalendar();
                    
                    if (this.selectedDate) {
                        const dateStr = this.formatDate(this.selectedDate);
                        this.showDayDetails(dateStr);
                    }
                });

                // カレンダークリック
                document.getElementById('calendar-main').addEventListener('click', (e) => {
                    const dayElement = e.target.closest('.day');
                    if (dayElement && dayElement.dataset.date && !dayElement.classList.contains('empty')) {
                        const dateStr = dayElement.dataset.date;
                        
                        if (this.selectedDate && 
                            this.formatDate(this.selectedDate) === dateStr) {
                            document.getElementById('transaction-modal-title').textContent = '投資取引を追加';
                            document.getElementById('edit-transaction-id').value = '';
                            document.getElementById('transaction-date').value = dateStr;
                            document.getElementById('investment-amount').value = '';
                            document.getElementById('return-amount').value = '';
                            document.getElementById('machine-name').value = '';
                            document.getElementById('shop-name').value = '';
                            modal.style.display = 'flex';
                        } else {
                            this.selectedDate = new Date(dateStr);
                            this.renderCalendar();
                            this.showDayDetails(dateStr);
                        }
                    }
                });

                // モーダル外クリックで閉じる
                window.addEventListener('click', (e) => {
                    if (e.target.classList.contains('month-picker-modal')) {
                        document.getElementById('month-picker-modal').style.display = 'none';
                    }
                    if (e.target.classList.contains('stats-modal')) {
                        document.getElementById('stats-modal').style.display = 'none';
                    }
                    if (e.target.classList.contains('modal')) {
                        document.getElementById('transaction-modal').style.display = 'none';
                        form.reset();
                    }
                    // テーマカスタマイザー外クリックで閉じる
                    if (!e.target.closest('.theme-customizer') && 
                        !e.target.closest('.theme-toggle') && 
                        e.target.id !== 'theme-toggle') {
                        document.getElementById('theme-customizer').style.display = 'none';
                    }
                });

                console.log('イベントリスナー設定完了');
            }

            // 背景画像アップロード処理
            handleBackgroundImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                // ファイルサイズ制限（10MBに拡大）
                if (file.size > 10 * 1024 * 1024) {
                    alert('ファイルサイズが大きすぎます。10MB以下の画像を選択してください。');
                    return;
                }

                // 画像形式チェック
                if (!file.type.match('image.*')) {
                    alert('画像ファイルを選択してください。');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const image = new Image();
                    image.onload = () => {
                        // 画像をDataURLとして保存（透過度70%、拡大率100%、中央配置）
                        this.setCalendarBackground(e.target.result, 70, 100, 'center center');
                        alert('背景画像を設定しました。\n透過度、拡大縮小、位置を調整できます。');
                    };
                    image.onerror = () => {
                        alert('画像の読み込みに失敗しました。別の画像を選択してください。');
                    };
                    image.src = e.target.result;
                };
                reader.onerror = () => {
                    alert('ファイルの読み込みに失敗しました。別のファイルを選択してください。');
                };
                reader.readAsDataURL(file);
                
                // ファイル入力をリセット
                event.target.value = '';
            }
        }

        // アプリケーションの初期化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing app...');
            window.financeApp = new FinanceCalendar();
        });
    </script>
</body>
</html>
