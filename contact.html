<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせフォーム</title>
    <style>
        /* 共通スタイル (トップページと共通の基本設定) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #2c3e50;
            text-align: center;
            line-height: 1.6;
        }

        .main-container {
            max-width: 700px; /* フォーム用に幅を少し狭く */
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); /* 少し明るい青に変更 */
            color: white;
            padding: 30px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            border: 2px solid #2ecc71;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ecf0f1;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            color: #bdc3c7;
        }

        /* フォーム全体 */
        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: left;
            border: 1px solid #e9ecef;
        }

        /* フォームグループ（ラベルと入力欄のセット） */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 1.05rem;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
            color: #495057;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            resize: vertical; /* textareaのみ縦方向のリサイズを許可 */
            background-color: #f8f9fa;
        }

        input:focus,
        textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
            outline: none;
            background-color: white;
        }

        /* 送信ボタン */
        .submit-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.5);
        }

        .submit-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }
        
        /* フッターリンク (トップページと共通のスタイルを流用) */
        .footer-links {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
            text-align: center;
        }
        
        .footer-links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #2980b9;
        }

        /* レスポンシブデザイン */
        @media (max-width: 600px) {
            .main-container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .contact-form {
                padding: 20px;
            }
            .form-group {
                margin-bottom: 20px;
            }
            input[type="text"],
            input[type="email"],
            textarea {
                padding: 12px;
                font-size: 0.95rem;
            }
            .submit-button {
                padding: 12px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>📧 お問い合わせフォーム 📧</h1>
            <div class="subtitle">バグ報告、ご意見、ご要望はこちらへ</div>
        </div>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">お名前 (必須)</label>
                <input type="text" id="name" name="name" required placeholder="例: 山田 太郎">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス (必須)</label>
                <input type="email" id="email" name="email" required placeholder="例: yourname@example.com">
            </div>
            
            <div class="form-group">
                <label for="subject">件名</label>
                <input type="text" id="subject" name="subject" placeholder="例: スロット仕事量ツールのバグについて">
            </div>

            <div class="form-group">
                <label for="message">お問い合わせ内容 (必須)</label>
                <textarea id="message" name="message" rows="8" required placeholder="具体的な内容をご記入ください"></textarea>
            </div>

            <button type="submit" class="submit-button">
                内容を送信する
            </button>
        </form>

        <div class="footer-links">
            <a href="index.html">トップページへ戻る</a>
        </div>
    </div>
</body>
</html>
