<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    color: #00ff00;
    overflow: hidden;
    transition: background-color 0.3s ease;
}

/* ボタン色に応じた背面色変化 */
body.red-bg { background: linear-gradient(135deg, #330000 0%, #660000 100%); }
body.green-bg { background: linear-gradient(135deg, #003300 0%, #006600 100%); }
body.blue-bg { background: linear-gradient(135deg, #000033 0%, #000066 100%); }
body.yellow-bg { background: linear-gradient(135deg, #333300 0%, #666600 100%); }

/* ハンバーガーメニュー - 左上に配置 */
.hamburger-menu {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
}

.hamburger-btn {
    width: 40px;
    height: 40px;
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    border: 2px solid #00ff00;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 8px;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
    transition: all 0.3s ease;
}

.hamburger-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background: #00ff00;
    transition: all 0.3s ease;
}

.hamburger-btn.active span:nth-child(1) {
    transform: rotate(45deg) translate(6px, 6px);
}

.hamburger-btn.active span:nth-child(2) {
    opacity: 0;
}

.hamburger-btn.active span:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -6px);
}

/* メニューオーバーレイ */
.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 999;
    display: none;
    justify-content: center;
    align-items: center;
}

.menu-overlay.active {
    display: flex;
}

.menu-content {
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    border: 2px solid #00ff00;
    border-radius: 15px;
    padding: 30px;
    max-width: 300px;
    width: 90%;
    box-shadow: 
        0 0 30px rgba(0, 255, 0, 0.5),
        4px 4px 10px rgba(0, 0, 0, 0.5);
}

.menu-title {
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}

.menu-items {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu-link {
    padding: 15px 20px;
    background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
    border: 2px solid #00ff00;
    border-radius: 10px;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
    text-decoration: none;
    display: block;
}

.menu-link:hover {
    background: linear-gradient(145deg, #00ff00, #00cc00);
    color: #000000;
    box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.2),
        0 0 15px #00ff00;
}

.menu-link.active {
    background: linear-gradient(145deg, #00ff00, #00cc00);
    color: #000000;
    box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.2),
        0 0 15px #00ff00;
}

/* 立体的な外枠 */
.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #1a1a1a;
    padding: 10px;
    border: 2px solid #00ff00;
    border-radius: 15px;
    min-height: 0;
    gap: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 0 30px rgba(0, 255, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
}

/* ネオンフレーム効果 */
.container::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border: 2px solid transparent;
    border-radius: 17px;
    background: linear-gradient(135deg, 
        rgba(0, 255, 0, 0.8) 0%, 
        rgba(0, 255, 0, 0.4) 50%, 
        rgba(0, 255, 0, 0.8) 100%);
    z-index: -1;
    animation: neonPulse 3s ease-in-out infinite;
}

@keyframes neonPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
}

/* モードボタンとリセットボタン */
.mode-controls {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    align-items: flex-start;
    flex-wrap: wrap;
}

.mode-buttons {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 0;
}

/* 立体的なモードボタン */
.mode-btn {
    flex: 1;
    padding: 10px 5px;
    border: none;
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    color: #00ff00;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 35px;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
}

.mode-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(0, 255, 0, 0.2), 
        transparent);
    transition: left 0.5s ease;
}

.mode-btn:hover::before {
    left: 100%;
}

.mode-btn.active {
    background: linear-gradient(145deg, #00ff00, #00cc00);
    color: #000000;
    font-weight: 700;
    box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.2),
        0 0 15px #00ff00;
}

/* 立体的なリセットボタン */
.reset-btn {
    padding: 10px 15px;
    border: none;
    background: linear-gradient(145deg, #ff3333, #cc0000);
    color: #000000;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 35px;
    white-space: nowrap;
    width: auto;
    min-width: 70px;
    flex-shrink: 0;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
}

.reset-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.3), 
        transparent);
    transition: left 0.5s ease;
}

.reset-btn:hover::before {
    left: 100%;
}

.reset-btn:active {
    transform: scale(0.95);
    box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.3),
        inset -2px -2px 4px rgba(255, 255, 255, 0.1);
}

/* メインコンテンツ */
.main-content {
    display: flex;
    flex-direction: column;
    gap: 15px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* 入力フィールドと増減ボタン */
.input-controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
    align-items: center;
}

.input-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
}

/* 入力フィールドの横幅を調整 */
.game-input {
    width: 100%;
    max-width: 200px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    text-align: center;
    font-size: 24px;
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    box-shadow: 
        inset 3px 3px 6px rgba(0, 0, 0, 0.5),
        inset -3px -3px 6px rgba(255, 255, 255, 0.05),
        0 0 10px rgba(0, 255, 0, 0.3);
    transition: all 0.3s ease;
}

.game-input:focus {
    outline: none;
    box-shadow: 
        inset 3px 3px 6px rgba(0, 0, 0, 0.5),
        inset -3px -3px 6px rgba(255, 255, 255, 0.05),
        0 0 20px #00ff00;
}

/* 増加・減少ボタン */
.inc-dec-buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 200px;
}

/* 立体的な増減ボタン */
.inc-dec-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.3s ease;
    text-align: center;
    min-height: 45px;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
}

.inc-dec-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    transition: left 0.5s ease;
}

.inc-dec-btn:hover::before {
    left: 100%;
}

.increment-btn {
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    color: #00ff00;
}

.increment-btn.active {
    background: linear-gradient(145deg, #00ff00, #00cc00);
    color: #000000;
    box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.2),
        0 0 15px #00ff00;
}

.decrement-btn {
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    color: #ff0000;
}

.decrement-btn.active {
    background: linear-gradient(145deg, #ff0000, #cc0000);
    color: #000000;
    box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.3),
        inset -2px -2px 4px rgba(0, 0, 0, 0.2),
        0 0 15px #ff0000;
}

.inc-dec-btn:active {
    transform: scale(0.92);
    box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.3),
        inset -2px -2px 4px rgba(255, 255, 255, 0.1);
}

/* カウントボタンエリア */
.circle-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex: 1;
    min-height: 0;
}

.circle-btn-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
    gap: 8px;
}

/* カウントと分数の表示 */
.count-display {
    font-size: 20px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    line-height: 1.2;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}

.rate-display {
    font-size: 14px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    opacity: 0.9;
    font-weight: 600;
    line-height: 1.2;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
}

/* 立体的な丸いカウントボタン */
.circle-btn {
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 
        4px 4px 8px rgba(0, 0, 0, 0.6),
        -3px -3px 6px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

/* ネオン光彩効果 */
.circle-btn::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 50%;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s ease;
}

/* ボタン押下時の立体的な効果 */
.circle-btn.pressed {
    transform: scale(0.85);
    box-shadow: 
        inset 3px 3px 6px rgba(0, 0, 0, 0.5),
        inset -3px -3px 6px rgba(255, 255, 255, 0.1);
}

.circle-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, 
        rgba(255, 255, 255, 0.3) 0%, 
        transparent 50%);
    opacity: 0.3;
}

/* 各ボタンの色と立体的な効果 */
.circle-btn-1 {
    background: linear-gradient(145deg, #ff3333, #cc0000);
    color: #000000;
}

.circle-btn-1::before {
    background: linear-gradient(135deg, #ff0000, #ff6666);
    box-shadow: 0 0 20px #ff0000;
}

.circle-btn-1.pressed::before {
    opacity: 1;
    box-shadow: 0 0 30px #ff0000;
}

.circle-btn-2 {
    background: linear-gradient(145deg, #33ff33, #00cc00);
    color: #000000;
}

.circle-btn-2::before {
    background: linear-gradient(135deg, #00ff00, #66ff66);
    box-shadow: 0 0 20px #00ff00;
}

.circle-btn-2.pressed::before {
    opacity: 1;
    box-shadow: 0 0 30px #00ff00;
}

.circle-btn-3 {
    background: linear-gradient(145deg, #3333ff, #0000cc);
    color: #ffffff;
}

.circle-btn-3::before {
    background: linear-gradient(135deg, #0000ff, #6666ff);
    box-shadow: 0 0 20px #0000ff;
}

.circle-btn-3.pressed::before {
    opacity: 1;
    box-shadow: 0 0 30px #0000ff;
}

.circle-btn-4 {
    background: linear-gradient(145deg, #ffff33, #cccc00);
    color: #000000;
}

.circle-btn-4::before {
    background: linear-gradient(135deg, #ffff00, #ffff66);
    box-shadow: 0 0 20px #ffff00;
}

.circle-btn-4.pressed::before {
    opacity: 1;
    box-shadow: 0 0 30px #ffff00;
}

/* 数字入力時のスピンボタンを非表示 */
.game-input::-webkit-outer-spin-button,
.game-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.game-input[type=number] {
    -moz-appearance: textfield;
}

/* 横向き用スタイル */
@media (orientation: landscape) {
    .main-content {
        flex-direction: row;
        gap: 20px;
    }
    
    .input-controls {
        min-width: 120px;
        justify-content: center;
        gap: 20px;
    }
    
    .input-section, .inc-dec-buttons {
        max-width: none;
    }
    
    .game-input {
        font-size: 28px;
        padding: 15px;
        max-width: 200px;
    }
    
    .inc-dec-btn {
        padding: 15px 10px;
        font-size: 16px;
        min-height: 50px;
    }
    
    .circle-btn-container {
        gap: 15px;
    }
    
    .count-display {
        font-size: 24px;
        min-height: 35px;
    }
    
    .rate-display {
        font-size: 18px;
        min-height: 25px;
    }
    
    .circle-btn {
        width: 80px;
        height: 80px;
    }
    
    /* 横画面でのモードコントロール調整 */
    .mode-controls {
        flex-wrap: nowrap;
    }
}

/* 縦画面の小さい画面用 */
@media (orientation: portrait) and (max-height: 600px) {
    .container {
        padding: 8px;
        gap: 10px;
    }
    
    .mode-controls {
        gap: 6px;
        flex-direction: column;
    }
    
    .mode-buttons {
        width: 100%;
    }
    
    .reset-btn {
        width: 100%;
        min-width: auto;
    }
    
    .mode-btn, .reset-btn {
        padding: 8px 4px;
        font-size: 11px;
        min-height: 30px;
    }
    
    .main-content {
        gap: 10px;
    }
    
    .input-controls {
        gap: 8px;
    }
    
    .game-input {
        font-size: 20px;
        padding: 10px;
        max-width: 180px;
    }
    
    .inc-dec-btn {
        padding: 10px 6px;
        font-size: 12px;
        min-height: 40px;
    }
    
    .count-display {
        font-size: 18px;
        min-height: 25px;
    }
    
    .rate-display {
        font-size: 12px;
        min-height: 18px;
    }
    
    .circle-btn {
        width: 60px;
        height: 60px;
        font-size: 14px;
    }
    
    .circle-btn-container {
        gap: 6px;
    }
}

/* 縦画面の大きい画面用 */
@media (orientation: portrait) and (min-height: 800px) {
    .container {
        padding: 15px;
        gap: 20px;
    }
    
    .main-content {
        gap: 20px;
    }
    
    .input-controls {
        gap: 15px;
    }
    
    .game-input {
        font-size: 28px;
        padding: 15px;
        max-width: 200px;
    }
    
    .inc-dec-btn {
        padding: 15px 10px;
        font-size: 16px;
        min-height: 50px;
    }
    
    .count-display {
        font-size: 24px;
    }
    
    .rate-display {
        font-size: 16px;
    }
    
    .circle-btn {
        width: 80px;
        height: 80px;
    }
    
    .circle-btn-container {
        gap: 12px;
    }
}

/* 確認ダイアログ用のオーバーレイ */
.confirm-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1001;
}

.confirm-dialog {
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    border: none;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    max-width: 280px;
    width: 90%;
    box-shadow: 
        0 0 30px rgba(0, 255, 0, 0.5),
        4px 4px 10px rgba(0, 0, 0, 0.5),
        -2px -2px 6px rgba(255, 255, 255, 0.05);
}

.confirm-message {
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 20px;
    font-size: 16px;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}

.confirm-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.confirm-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
    flex: 1;
    font-size: 14px;
    box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.5),
        -2px -2px 4px rgba(255, 255, 255, 0.05);
}

.confirm-btn.yes {
    background: linear-gradient(145deg, #00ff00, #00cc00);
    color: #000000;
}

.confirm-btn.yes:active {
    background: linear-gradient(145deg, #00cc00, #00ff00);
    transform: scale(0.95);
    box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.3),
        inset -2px -2px 4px rgba(255, 255, 255, 0.1);
}

.confirm-btn.no {
    background: linear-gradient(145deg, #ff3333, #cc0000);
    color: #000000;
}

.confirm-btn.no:active {
    background: linear-gradient(145deg, #cc0000, #ff3333);
    transform: scale(0.95);
    box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.3),
        inset -2px -2px 4px rgba(255, 255, 255, 0.1);
}
</style>
</head>
<body>
<!-- ハンバーガーメニュー - 左上に配置 -->
<div class="hamburger-menu">
    <button class="hamburger-btn" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</div>

<!-- メニューオーバーレイ -->
<div class="menu-overlay" id="menuOverlay">
    <div class="menu-content">
        <div class="menu-title">メニュー</div>
        <div class="menu-items">
            <!-- トップページへのリンクを追加 -->
            <a href="index.html" class="menu-link">トップページへ</a>
            <a href="counter.html" class="menu-link active">カウンターアプリ</a>
            <a href="pachinko_calc.html" class="menu-link">パチンコ計算機</a>
        </div>
    </div>
</div>

<!-- カウンターアプリのコンテンツ -->
<div class="container">
    <!-- モードボタンとリセットボタン -->
    <div class="mode-controls">
        <div class="mode-buttons">
            <button class="mode-btn" data-mode="A">MODE A</button>
            <button class="mode-btn" data-mode="B">MODE B</button>
            <button class="mode-btn" data-mode="C">MODE C</button>
        </div>
        <button class="reset-btn" id="resetBtn">リセット</button>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <!-- 上：入力フィールドと増減ボタン -->
        <div class="input-controls">
            <div class="input-section">
                <input type="number" class="game-input" id="totalCount" value="0" min="0">
            </div>
            
            <div class="inc-dec-buttons">
                <button class="inc-dec-btn increment-btn active" id="incrementBtn">増加</button>
                <button class="inc-dec-btn decrement-btn" id="decrementBtn">減少</button>
            </div>
        </div>

        <!-- 下：丸いカウントボタン -->
        <div class="circle-buttons">
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay1">0</div>
                <div class="rate-display" id="rateDisplay1">1/0.00</div>
                <button class="circle-btn circle-btn-1" data-index="0"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay2">0</div>
                <div class="rate-display" id="rateDisplay2">1/0.00</div>
                <button class="circle-btn circle-btn-2" data-index="1"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay3">0</div>
                <div class="rate-display" id="rateDisplay3">1/0.00</div>
                <button class="circle-btn circle-btn-3" data-index="2"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay4">0</div>
                <div class="rate-display" id="rateDisplay4">1/0.00</div>
                <button class="circle-btn circle-btn-4" data-index="3"></button>
            </div>
        </div>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        this.isIncrementMode = true;
        
        // ローカルストレージからデータを読み込む
        this.loadFromStorage();
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
        this.updateDisplay();
        
        // 画面回転時のリサイズ対応
        this.handleResize();
        window.addEventListener('resize', () => this.handleResize());
        window.addEventListener('orientationchange', () => this.handleResize());
        
        // ページを閉じる前にデータを保存
        window.addEventListener('beforeunload', () => {
            this.saveToStorage();
        });
    }

    // ローカルストレージからデータを読み込む
    loadFromStorage() {
        try {
            const savedData = localStorage.getItem('counterAppData');
            if (savedData) {
                const data = JSON.parse(savedData);
                
                if (data.counts) {
                    this.counts = data.counts;
                } else {
                    this.counts = {
                        'A': [0, 0, 0, 0],
                        'B': [0, 0, 0, 0],
                        'C': [0, 0, 0, 0]
                    };
                }
                
                if (data.totalGames) {
                    this.totalGames = data.totalGames;
                } else {
                    this.totalGames = {
                        'A': 0,
                        'B': 0,
                        'C': 0
                    };
                }
                
                if (data.currentMode) {
                    this.currentMode = data.currentMode;
                }
                
                if (typeof data.isIncrementMode !== 'undefined') {
                    this.isIncrementMode = data.isIncrementMode;
                }
                
                console.log('データをローカルストレージから読み込みました');
            } else {
                this.counts = {
                    'A': [0, 0, 0, 0],
                    'B': [0, 0, 0, 0],
                    'C': [0, 0, 0, 0]
                };
                
                this.totalGames = {
                    'A': 0,
                    'B': 0,
                    'C': 0
                };
            }
        } catch (error) {
            console.error('データの読み込みに失敗しました:', error);
            this.counts = {
                'A': [0, 0, 0, 0],
                'B': [0, 0, 0, 0],
                'C': [0, 0, 0, 0]
            };
            
            this.totalGames = {
                'A': 0,
                'B': 0,
                'C': 0
            };
        }
    }

    // ローカルストレージにデータを保存する
    saveToStorage() {
        try {
            const data = {
                counts: this.counts,
                totalGames: this.totalGames,
                currentMode: this.currentMode,
                isIncrementMode: this.isIncrementMode,
                lastSaved: new Date().toISOString()
            };
            
            localStorage.setItem('counterAppData', JSON.stringify(data));
            console.log('データをローカルストレージに保存しました');
        } catch (error) {
            console.error('データの保存に失敗しました:', error);
        }
    }

    initializeElements() {
        this.totalCountElement = document.getElementById('totalCount');
        this.modeButtons = document.querySelectorAll('.mode-btn');
        this.circleButtons = document.querySelectorAll('.circle-btn');
        this.incrementBtn = document.getElementById('incrementBtn');
        this.decrementBtn = document.getElementById('decrementBtn');
        this.resetBtn = document.getElementById('resetBtn');
        
        this.countDisplays = [
            document.getElementById('countDisplay1'),
            document.getElementById('countDisplay2'),
            document.getElementById('countDisplay3'),
            document.getElementById('countDisplay4')
        ];
        
        this.rateDisplays = [
            document.getElementById('rateDisplay1'),
            document.getElementById('rateDisplay2'),
            document.getElementById('rateDisplay3'),
            document.getElementById('rateDisplay4')
        ];

        // ハンバーガーメニュー要素
        this.hamburgerBtn = document.getElementById('hamburgerBtn');
        this.menuOverlay = document.getElementById('menuOverlay');
    }

    handleResize() {
        setTimeout(() => {
            const container = document.querySelector('.container');
            if (container) {
                container.style.minHeight = '0';
            }
        }, 100);
    }

    setupEventListeners() {
        // ハンバーガーメニューのイベント
        this.hamburgerBtn.addEventListener('click', () => {
            this.toggleMenu();
        });

        this.menuOverlay.addEventListener('click', (e) => {
            if (e.target === this.menuOverlay) {
                this.closeMenu();
            }
        });

        // 既存のカウンターイベント
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        this.circleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
        });

        [this.incrementBtn, this.decrementBtn].forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    if (btn === this.incrementBtn) {
                        this.setIncrementMode(true);
                    } else if (btn === this.decrementBtn) {
                        this.setIncrementMode(false);
                    }
                });
            });
        });

        this.resetBtn.addEventListener('click', () => {
            this.handleButtonPress(this.resetBtn, () => {
                this.showResetConfirmation();
            });
        });

        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
            this.updateDisplay();
            this.saveToStorage();
        });

        setInterval(() => {
            this.saveToStorage();
        }, 10000);
    }

    // ハンバーガーメニュー機能
    toggleMenu() {
        this.hamburgerBtn.classList.toggle('active');
        this.menuOverlay.classList.toggle('active');
    }

    closeMenu() {
        this.hamburgerBtn.classList.remove('active');
        this.menuOverlay.classList.remove('active');
    }

    // 既存のカウンター機能
    handleButtonPress(button, callback) {
        if (button.classList.contains('circle-btn-1')) {
            document.body.classList.add('red-bg');
        } else if (button.classList.contains('circle-btn-2')) {
            document.body.classList.add('green-bg');
        } else if (button.classList.contains('circle-btn-3')) {
            document.body.classList.add('blue-bg');
        } else if (button.classList.contains('circle-btn-4')) {
            document.body.classList.add('yellow-bg');
        }
        
        if (button.classList.contains('circle-btn')) {
            button.classList.add('pressed');
            setTimeout(() => {
                button.classList.remove('pressed');
            }, 200);
        } else {
            button.style.transform = 'scale(0.92)';
            setTimeout(() => {
                button.style.transform = '';
            }, 200);
        }
        
        setTimeout(() => {
            document.body.classList.remove('red-bg', 'green-bg', 'blue-bg', 'yellow-bg');
        }, 300);
        
        setTimeout(callback, 50);
    }

    setMode(mode) {
        this.currentMode = mode;

        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        this.totalCountElement.value = this.totalGames[this.currentMode];
        
        this.updateDisplay();
        this.saveToStorage();
    }

    setIncrementMode(isIncrement) {
        this.isIncrementMode = isIncrement;
        
        if (isIncrement) {
            this.incrementBtn.classList.add('active');
            this.decrementBtn.classList.remove('active');
        } else {
            this.incrementBtn.classList.remove('active');
            this.decrementBtn.classList.add('active');
        }
        
        this.saveToStorage();
    }

    handleCountButton(buttonIndex) {
        const currentCounts = this.counts[this.currentMode];
        
        if (this.isIncrementMode) {
            currentCounts[buttonIndex]++;
        } else {
            if (currentCounts[buttonIndex] > 0) {
                currentCounts[buttonIndex]--;
            }
        }
        
        this.updateDisplay();
        this.saveToStorage();
    }

    showResetConfirmation() {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        
        const dialog = document.createElement('div');
        dialog.className = 'confirm-dialog';
        
        const message = document.createElement('div');
        message.className = 'confirm-message';
        message.textContent = '全て消去しますがよろしいですか？';
        
        const buttons = document.createElement('div');
        buttons.className = 'confirm-buttons';
        
        const yesBtn = document.createElement('button');
        yesBtn.className = 'confirm-btn yes';
        yesBtn.textContent = 'はい';
        yesBtn.onclick = () => {
            this.resetCurrentMode();
            document.body.removeChild(overlay);
        };
        
        const noBtn = document.createElement('button');
        noBtn.className = 'confirm-btn no';
        noBtn.textContent = 'いいえ';
        noBtn.onclick = () => {
            document.body.removeChild(overlay);
        };
        
        buttons.appendChild(yesBtn);
        buttons.appendChild(noBtn);
        
        dialog.appendChild(message);
        dialog.appendChild(buttons);
        overlay.appendChild(dialog);
        
        document.body.appendChild(overlay);
    }

    resetCurrentMode() {
        this.counts[this.currentMode] = [0, 0, 0, 0];
        this.updateDisplay();
        this.saveToStorage();
    }

    updateTotalGames() {
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames[this.currentMode] = value;
        this.totalCountElement.value = value;
        this.updateDisplay();
        this.saveToStorage();
    }

    updateDisplay() {
        const currentCounts = this.counts[this.currentMode];
        const currentTotalGames = this.totalGames[this.currentMode];
        
        this.countDisplays.forEach((element, index) => {
            element.textContent = currentCounts[index];
        });
        
        this.rateDisplays.forEach((element, index) => {
            const count = currentCounts[index];
            let rate = "1/0.00";
            
            if (count > 0 && currentTotalGames > 0) {
                const calculatedRate = currentTotalGames / count;
                rate = `1/${calculatedRate.toFixed(2)}`;
            } else if (count > 0) {
                rate = "1/0.00";
            }
            
            element.textContent = rate;
        });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
</body>
</html>
