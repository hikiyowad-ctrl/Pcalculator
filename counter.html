<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
}

body {
    font-family: 'Rajdhani', sans-serif;
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    background-color: #0a0a0a;
    touch-action: pan-y;
    color: #00ff00;
}

.container {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
    border: 1px solid #00ff00;
}

.header {
    text-align: center;
    margin-bottom: 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
    letter-spacing: 2px;
}

.mode-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
}

.mode-btn {
    padding: 12px 5px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

.mode-btn:hover {
    background: #003300;
}

.mode-btn.active {
    background: #00ff00;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 10px #00ff00;
}

.counter-display {
    text-align: center;
    margin: 20px 0;
    background: #000000;
    border-radius: 10px;
    padding: 20px;
    border: 2px solid #00ff00;
}

.counter-value {
    font-size: 48px;
    font-weight: 700;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    text-shadow: 0 0 10px #00ff00;
    letter-spacing: 2px;
}

.counter-label {
    font-size: 14px;
    color: #00ff00;
    margin-top: 5px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    opacity: 0.8;
}

.control-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.control-btn {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

.increment-btn {
    background: #004400;
    color: #00ff00;
    border: 2px solid #00ff00;
}

.increment-btn:active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

.decrement-btn {
    background: #440000;
    color: #ff0000;
    border: 2px solid #ff0000;
}

.decrement-btn:active {
    background: #ff0000;
    color: #000000;
    box-shadow: 0 0 15px #ff0000;
}

.reset-btn {
    background: #444400;
    color: #ffff00;
    border: 2px solid #ffff00;
}

.reset-btn:active {
    background: #ffff00;
    color: #000000;
    box-shadow: 0 0 15px #ffff00;
}

.stats {
    background: #000000;
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 20px;
    border: 1px solid #00ff00;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.stat-label {
    font-weight: 600;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    font-size: 14px;
}

.input-field {
    width: 100px;
    padding: 8px;
    border: 1px solid #00ff00;
    border-radius: 5px;
    text-align: center;
    font-size: 16px;
    background: #000000;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 500;
}

.input-field:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 10px #00ff00;
}

.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.stat-box {
    background: #111111;
    border: 1px solid #00ff00;
    border-radius: 5px;
    padding: 10px;
    text-align: center;
}

.stat-mode {
    font-size: 12px;
    color: #00ff00;
    margin-bottom: 5px;
    font-family: 'Orbitron', sans-serif;
}

.stat-value {
    font-size: 16px;
    font-weight: 700;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
}

/* 数字入力時のスピンボタンを非表示 */
.input-field::-webkit-outer-spin-button,
.input-field::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.input-field[type=number] {
    -moz-appearance: textfield;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">個人Gm</div>
    
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="A">MODE A</button>
        <button class="mode-btn" data-mode="B">MODE B</button>
        <button class="mode-btn" data-mode="C">MODE C</button>
        <button class="mode-btn" data-mode="D">MODE D</button>
        <button class="mode-btn" data-mode="E">MODE E</button>
        <button class="mode-btn" data-mode="F">MODE F</button>
    </div>

    <div class="counter-display">
        <div class="counter-value" id="currentCount">0</div>
        <div class="counter-label" id="currentModeLabel">MODE A のカウント</div>
    </div>

    <div class="control-buttons">
        <button class="control-btn increment-btn" id="incrementBtn">+</button>
        <button class="control-btn decrement-btn" id="decrementBtn">-</button>
        <button class="control-btn reset-btn" id="resetBtn">リセット</button>
    </div>

    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">GAME</span>
            <input type="number" class="input-field" id="totalCount" value="0" min="0">
        </div>
        
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-mode">MODE A</div>
                <div class="stat-value" id="statA">0/0.00%</div>
            </div>
            <div class="stat-box">
                <div class="stat-mode">MODE B</div>
                <div class="stat-value" id="statB">0/0.00%</div>
            </div>
            <div class="stat-box">
                <div class="stat-mode">MODE C</div>
                <div class="stat-value" id="statC">0/0.00%</div>
            </div>
            <div class="stat-box">
                <div class="stat-mode">MODE D</div>
                <div class="stat-value" id="statD">0/0.00%</div>
            </div>
            <div class="stat-box">
                <div class="stat-mode">MODE E</div>
                <div class="stat-value" id="statE">0/0.00%</div>
            </div>
            <div class="stat-box">
                <div class="stat-mode">MODE F</div>
                <div class="stat-value" id="statF">0/0.00%</div>
            </div>
        </div>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        // 各小役ごとに独立したカウントを保持
        this.counts = {
            'A': 0,
            'B': 0,
            'C': 0,
            'D': 0,
            'E': 0,
            'F': 0
        };
        
        this.totalGames = 0;
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
        this.updateAllStats();
    }

    initializeElements() {
        this.currentCountElement = document.getElementById('currentCount');
        this.currentModeLabel = document.getElementById('currentModeLabel');
        this.totalCountElement = document.getElementById('totalCount');
        this.incrementBtn = document.getElementById('incrementBtn');
        this.decrementBtn = document.getElementById('decrementBtn');
        this.resetBtn = document.getElementById('resetBtn');
        this.modeButtons = document.querySelectorAll('.mode-btn');
        
        // 統計表示要素
        this.statElements = {
            'A': document.getElementById('statA'),
            'B': document.getElementById('statB'),
            'C': document.getElementById('statC'),
            'D': document.getElementById('statD'),
            'E': document.getElementById('statE'),
            'F': document.getElementById('statF')
        };
    }

    setupEventListeners() {
        // モードボタン
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        // インクリメントボタン
        this.incrementBtn.addEventListener('click', () => {
            this.increment();
        });

        // デクリメントボタン
        this.decrementBtn.addEventListener('click', () => {
            this.decrement();
        });

        // リセットボタン
        this.resetBtn.addEventListener('click', () => {
            this.resetCurrent();
        });

        // 総G数入力の変更を監視
        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
            this.updateAllStats();
        });

        // タッチイベント（スマホ対応）
        this.incrementBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.increment();
        });

        this.decrementBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.decrement();
        });

        this.resetBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.resetCurrent();
        });
    }

    setMode(mode) {
        this.currentMode = mode;

        // アクティブなモードボタンのスタイル更新
        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 現在のモードのカウントを表示
        this.updateDisplay();
        this.currentModeLabel.textContent = `MODE ${mode} のカウント`;
    }

    increment() {
        this.counts[this.currentMode]++;
        this.updateDisplay();
        this.updateAllStats();
    }

    decrement() {
        if (this.counts[this.currentMode] > 0) {
            this.counts[this.currentMode]--;
            this.updateDisplay();
            this.updateAllStats();
        }
    }

    resetCurrent() {
        this.counts[this.currentMode] = 0;
        this.updateDisplay();
        this.updateAllStats();
    }

    updateDisplay() {
        this.currentCountElement.textContent = this.counts[this.currentMode];
    }

    updateTotalGames() {
        // 入力値のバリデーション
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames = value;
        this.totalCountElement.value = value;
    }

    updateAllStats() {
        // 各モードの統計を更新
        for (let mode of ['A', 'B', 'C', 'D', 'E', 'F']) {
            this.updateStat(mode);
        }
    }

    updateStat(mode) {
        const count = this.counts[mode];
        let percentage = "0.00%";
        
        if (this.totalGames > 0) {
            percentage = (count / this.totalGames * 100).toFixed(2) + "%";
        }
        
        this.statElements[mode].textContent = `${count}/${percentage}`;
    }
}

// アプリケーションの初期化
document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
</body>
</html>
