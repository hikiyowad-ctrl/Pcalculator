<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【仕事量計算】パチスロツール集 トップページ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #2c3e50;
            text-align: center;
            line-height: 1.6;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 2px solid #3498db;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #2ecc71, #3498db);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ecf0f1;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            color: #bdc3c7;
            font-weight: 500;
        }

        /* ツールメニュー */
        .tool-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tool-link {
            padding: 25px 20px;
            background: white;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .tool-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            transition: left 0.5s ease;
        }

        .tool-link:hover::before {
            left: 100%;
        }

        .tool-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        /* 各ツールの個別カラー */
        .tool-link:nth-child(1) {
            border-color: #27ae60;
            background: linear-gradient(135deg, #ffffff, #f8fff9);
        }

        .tool-link:nth-child(1):hover {
            background: linear-gradient(135deg, #f8fff9, #f0fff4);
        }

        .tool-link:nth-child(2) {
            border-color: #e74c3c;
            background: linear-gradient(135deg, #ffffff, #fff8f8);
        }

        .tool-link:nth-child(2):hover {
            background: linear-gradient(135deg, #fff8f8, #fff0f0);
        }

        .tool-link:nth-child(3) {
            border-color: #3498db;
            background: linear-gradient(135deg, #ffffff, #f8fbff);
        }

        .tool-link:nth-child(3):hover {
            background: linear-gradient(135deg, #f8fbff, #f0f7ff);
        }
        
        /* 新しく追加する収支ツール用の色 */
        .tool-link:nth-child(4) {
            border-color: #9b59b6; /* 紫色系 */
            background: linear-gradient(135deg, #ffffff, #faf8ff);
        }

        .tool-link:nth-child(4):hover {
            background: linear-gradient(135deg, #faf8ff, #f5f0ff);
        }
