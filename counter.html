<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100vh;
    height: 100vw;
    overflow: hidden;
    background-color: #0a0a0a;
    transform: rotate(90deg);
    transform-origin: center center;
    position: fixed;
    top: 50%;
    left: 50%;
    margin-top: -50vw;
    margin-left: -50vh;
}

.container {
    display: flex;
    height: 100%;
    background: #1a1a1a;
    padding: 10px;
    border: 1px solid #00ff00;
}

/* 左側の増減切り替えボタン */
.mode-toggle {
    width: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-right: 10px;
}

.toggle-btn {
    width: 50px;
    height: 50px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 5px 0;
    transition: all 0.3s ease;
}

.toggle-btn.active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 10px #00ff00;
}

/* メインコンテンツ */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    margin-bottom: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
    letter-spacing: 2px;
    flex-shrink: 0;
}

.mode-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.mode-btn {
    flex: 1;
    padding: 8px 5px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 40px;
}

.mode-btn.active {
    background: #00ff00;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 10px #00ff00;
}

/* カウントボタンエリア */
.count-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
    margin-bottom: 10px;
}

.count-btn {
    border: 2px solid;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    padding: 10px;
}

.count-btn:active {
    transform: scale(0.95);
}

/* 各ボタンの色 */
.count-btn-1 {
    border-color: #ff0000;
    background: #440000;
    color: #ff0000;
}

.count-btn-1:active {
    background: #ff0000;
    color: #000000;
    box-shadow: 0 0 15px #ff0000;
}

.count-btn-2 {
    border-color: #00ff00;
    background: #004400;
    color: #00ff00;
}

.count-btn-2:active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

.count-btn-3 {
    border-color: #0000ff;
    background: #000044;
    color: #0000ff;
}

.count-btn-3:active {
    background: #0000ff;
    color: #ffffff;
    box-shadow: 0 0 15px #0000ff;
}

.count-btn-4 {
    border-color: #ffff00;
    background: #444400;
    color: #ffff00;
}

.count-btn-4:active {
    background: #ffff00;
    color: #000000;
    box-shadow: 0 0 15px #ffff00;
}

.count-value {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 5px;
}

.count-label {
    font-size: 10px;
    opacity: 0.8;
}

/* 下部のGAMEカウンター */
.game-counter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000000;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #00ff00;
    flex-shrink: 0;
}

.stat-label {
    font-weight: 600;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    font-size: 14px;
}

.input-field {
    width: 80px;
    padding: 8px;
    border: 1px solid #00ff00;
    border-radius: 5px;
    text-align: center;
    font-size: 14px;
    background: #000000;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 500;
}

.input-field:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 10px #00ff00;
}

/* 数字入力時のスピンボタンを非表示 */
.input-field::-webkit-outer-spin-button,
.input-field::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.input-field[type=number] {
    -moz-appearance: textfield;
}
</style>
</head>
<body>
<div class="container">
    <!-- 左側の増減切り替えボタン -->
    <div class="mode-toggle">
        <button class="toggle-btn active" id="incrementMode">増加</button>
        <button class="toggle-btn" id="decrementMode">減少</button>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="header">個人Gm</div>
        
        <div class="mode-buttons">
            <button class="mode-btn" data-mode="A">MODE A</button>
            <button class="mode-btn" data-mode="B">MODE B</button>
            <button class="mode-btn" data-mode="C">MODE C</button>
            <button class="mode-btn" data-mode="D">MODE D</button>
            <button class="mode-btn" data-mode="E">MODE E</button>
            <button class="mode-btn" data-mode="F">MODE F</button>
        </div>

        <!-- 4つのカウントボタン -->
        <div class="count-buttons">
            <button class="count-btn count-btn-1" data-value="1">
                <div class="count-value" id="count1">0</div>
                <div class="count-label">カウント1</div>
            </button>
            <button class="count-btn count-btn-2" data-value="1">
                <div class="count-value" id="count2">0</div>
                <div class="count-label">カウント2</div>
            </button>
            <button class="count-btn count-btn-3" data-value="1">
                <div class="count-value" id="count3">0</div>
                <div class="count-label">カウント3</div>
            </button>
            <button class="count-btn count-btn-4" data-value="1">
                <div class="count-value" id="count4">0</div>
                <div class="count-label">カウント4</div>
            </button>
        </div>

        <div class="game-counter">
            <span class="stat-label">GAME</span>
            <input type="number" class="input-field" id="totalCount" value="0" min="0">
        </div>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        this.isIncrementMode = true;
        
        // 各モードと各カウントボタンの値を保持
        this.counts = {
            'A': [0, 0, 0, 0], // [count1, count2, count3, count4]
            'B': [0, 0, 0, 0],
            'C': [0, 0, 0, 0],
            'D': [0, 0, 0, 0],
            'E': [0, 0, 0, 0],
            'F': [0, 0, 0, 0]
        };
        
        this.totalGames = 0;
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
        this.updateDisplay();
    }

    initializeElements() {
        this.totalCountElement = document.getElementById('totalCount');
        this.modeButtons = document.querySelectorAll('.mode-btn');
        this.toggleButtons = document.querySelectorAll('.toggle-btn');
        this.countButtons = document.querySelectorAll('.count-btn');
        
        // カウント表示要素
        this.countElements = [
            document.getElementById('count1'),
            document.getElementById('count2'),
            document.getElementById('count3'),
            document.getElementById('count4')
        ];
    }

    setupEventListeners() {
        // モードボタン
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        // 増減切り替えボタン
        this.toggleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.id === 'incrementMode') {
                    this.setIncrementMode(true);
                } else {
                    this.setIncrementMode(false);
                }
            });
        });

        // カウントボタン
        this.countButtons.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                this.handleCountButton(index);
            });
        });

        // 総G数入力の変更を監視
        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
        });

        // タッチイベント（スマホ対応）
        this.countButtons.forEach((btn, index) => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.handleCountButton(index);
            });
        });
    }

    setMode(mode) {
        this.currentMode = mode;

        // アクティブなモードボタンのスタイル更新
        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 現在のモードのカウントを表示
        this.updateDisplay();
    }

    setIncrementMode(isIncrement) {
        this.isIncrementMode = isIncrement;
        
        // 増減ボタンのスタイル更新
        this.toggleButtons.forEach(btn => {
            if ((btn.id === 'incrementMode' && isIncrement) || 
                (btn.id === 'decrementMode' && !isIncrement)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    handleCountButton(buttonIndex) {
        const currentCounts = this.counts[this.currentMode];
        
        if (this.isIncrementMode) {
            // 増加モード
            currentCounts[buttonIndex]++;
        } else {
            // 減少モード
            if (currentCounts[buttonIndex] > 0) {
                currentCounts[buttonIndex]--;
            }
        }
        
        this.updateDisplay();
    }

    updateDisplay() {
        const currentCounts = this.counts[this.currentMode];
        
        // 各カウントボタンの表示を更新
        this.countElements.forEach((element, index) => {
            element.textContent = currentCounts[index];
        });
    }

    updateTotalGames() {
        // 入力値のバリデーション
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames = value;
        this.totalCountElement.value = value;
    }
}

// アプリケーションの初期化
document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
</body>
</html>
