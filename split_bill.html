<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノリうち精算ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            min-height: 100vh;
            color: #5a3e36;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
            border: 4px solid #ffd166;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #ffd166, #06d6a0, #118ab2, #ff6b6b);
            background-size: 200% 100%;
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            color: #fff;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 500;
        }

        /* ハンバーガーメニュー */
        .menu-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .menu-toggle {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            border: 3px solid #ffd166;
            color: white;
            padding: 12px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .menu-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            min-width: 200px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 3px solid #ffd166;
            margin-top: 10px;
            overflow: hidden;
        }

        .menu-content.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            display: block;
            padding: 15px 20px;
            color: #5a3e36;
            text-decoration: none;
            border-bottom: 1px solid #ffd166;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .menu-item:hover {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* セクション */
        .section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 248, 225, 0.9));
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.15);
            border: 3px solid #ffd166;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ffd166, #06d6a0, #ff6b6b);
            background-size: 200% 100%;
            animation: rainbow 3s linear infinite;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff6b6b;
            padding-bottom: 12px;
            border-bottom: 3px dashed #ffd166;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* メンバー入力 */
        .member-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .member-card {
            background: linear-gradient(135deg, #fff, #fff5e6);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #ffd166;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.2);
        }

        .member-card::before {
            content: '👤';
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 1.5rem;
            background: #ffd166;
            padding: 5px 10px;
            border-radius: 50%;
            border: 3px solid white;
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            margin-top: 5px;
        }

        .member-name {
            font-weight: bold;
            color: #ff6b6b;
            font-size: 1.2rem;
        }

        .remove-member {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .remove-member:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #5a3e36;
            font-size: 1rem;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #ffd166;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            color: #5a3e36;
            font-size: 1rem;
            transition: all 0.3s ease;
            /* 増減ボタンを非表示 */
            -moz-appearance: textfield;
        }

        .form-input::-webkit-outer-spin-button,
        .form-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff6b6b;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
        }

        /* ボタン */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            min-width: 160px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #118ab2, #06d6a0);
            border: 3px solid #ffd166;
        }

        .btn-success {
            background: linear-gradient(135deg, #06d6a0, #0acf83);
            border: 3px solid #ffd166;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ff9e6d, #ff8e53);
            border: 3px solid #ffd166;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* 精算結果 */
        .settlement-result {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 248, 225, 0.95));
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border: 3px solid #ffd166;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.1);
        }

        .result-item {
            padding: 20px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff, #fff8e6);
            border-radius: 12px;
            border-left: 6px solid #06d6a0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .payment-item {
            padding: 18px;
            margin: 12px 0;
            background: linear-gradient(135deg, rgba(6, 214, 160, 0.1), rgba(6, 214, 160, 0.05));
            border-radius: 12px;
            border-left: 5px solid #06d6a0;
            border: 2px solid rgba(6, 214, 160, 0.3);
        }

        .payment-negative {
            padding: 18px;
            margin: 12px 0;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(255, 107, 107, 0.05));
            border-radius: 12px;
            border-left: 5px solid #ff6b6b;
            border: 2px solid rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
        }

        .positive {
            color: #06d6a0;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .negative {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .remainder {
            color: #118ab2;
            font-weight: bold;
            background: linear-gradient(135deg, rgba(17, 138, 178, 0.1), rgba(17, 138, 178, 0.05));
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            border: 2px dashed #118ab2;
        }

        /* アニメーション */
        @keyframes moneyTransfer {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(20px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }

        .money-animation {
            animation: moneyTransfer 0.6s ease-in-out;
        }

        .payment-arrow {
            display: inline-block;
            margin: 0 15px;
            animation: bounce 1s infinite;
            font-size: 1.3rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }

        @keyframes moneyFly {
            0% { transform: translateX(0) translateY(0) scale(1); opacity: 1; }
            50% { transform: translateX(100px) translateY(-20px) scale(1.3); opacity: 0.8; }
            100% { transform: translateX(200px) translateY(0) scale(1); opacity: 0; }
        }

        .money-fly {
            position: relative;
            overflow: hidden;
        }

        .money-fly::after {
            content: '💰';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            animation: moneyFly 1.5s ease-in-out forwards;
            z-index: 10;
            font-size: 1.8rem;
        }

        /* 装飾要素 */
        .emoji-decoration {
            font-size: 2rem;
            margin-right: 10px;
        }

        .friend-bubble {
            background: white;
            padding: 10px 15px;
            border-radius: 20px;
            margin: 10px 0;
            border: 2px solid #ffd166;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .friend-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border: 10px solid transparent;
            border-right-color: #ffd166;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .member-inputs {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            h1 {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .menu-container {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- ハンバーガーメニュー -->
    <div class="menu-container">
        <button class="menu-toggle" onclick="toggleMenu()">☰ メニュー</button>
        <div class="menu-content" id="menuContent">
            <a href="index.html" class="menu-item">🏠 トップページ</a>
            <a href="counter.html" class="menu-item">🎯 小役カウンター</a>
            <a href="pachinko_calc.html" class="menu-item">🎰 パチンコ仕事量計算ツール</a>
            <a href="slot_calc.html" class="menu-item">🎮 スロット仕事量計算ツール</a>
        </div>
    </div>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>🎉 ノリうち精算ツール</h1>
            <div class="subtitle">友達とのお金のやり取りを楽しく簡単に！</div>
        </div>

        <!-- メンバー入力 -->
        <div class="section">
            <div class="section-title">
                <span class="emoji-decoration">👥</span>
                メンバー情報入力
            </div>
            <div class="friend-bubble">
                みんなの投資額と回収額を入力してください🎊
            </div>
            <div id="memberInputs" class="member-inputs">
                <!-- メンバーカードがここに追加されます -->
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="addMember()">
                    <span class="emoji-decoration">➕</span>
                    メンバー追加
                </button>
                <button class="btn btn-success" onclick="calculateSettlement()">
                    <span class="emoji-decoration">🧮</span>
                    精算
                </button>
                <button class="btn btn-warning" onclick="clearAll()">
                    <span class="emoji-decoration">🔄</span>
                    全クリア
                </button>
            </div>
        </div>

        <!-- 精算結果 -->
        <div class="section">
            <div class="section-title">
                <span class="emoji-decoration">💰</span>
                精算結果
            </div>
            <div id="settlementResult" class="settlement-result">
                <div style="text-align: center; color: #8d6e63; padding: 40px 20px;">
                    <div style="font-size: 4rem; margin-bottom: 20px;">🤝</div>
                    <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">
                        メンバー情報を入力して「精算」を押してください
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let memberCount = 0;

        // ページ読み込み時に初期メンバーを追加
        document.addEventListener('DOMContentLoaded', function() {
            addMember(); // 最初のメンバーを追加
            addMember(); // 2人目のメンバーを追加
        });

        // ハンバーガーメニューの表示/非表示
        function toggleMenu() {
            const menuContent = document.getElementById('menuContent');
            menuContent.classList.toggle('show');
        }

        // メンバー追加
        function addMember() {
            memberCount++;
            const memberId = `member_${memberCount}`;
            
            const memberCard = document.createElement('div');
            memberCard.className = 'member-card';
            memberCard.id = memberId;
            
            memberCard.innerHTML = `
                <div class="member-header">
                    <div class="member-name">メンバー ${memberCount}</div>
                    ${memberCount > 2 ? '<button class="remove-member" onclick="removeMember(\'' + memberId + '\')">削除</button>' : ''}
                </div>
                <div class="input-group">
                    <label class="input-label">👤 名前</label>
                    <input type="text" class="form-input member-name-input" placeholder="例: 山田太郎" value="メンバー ${memberCount}">
                </div>
                <div class="input-group">
                    <label class="input-label">💸 投資額 (円)</label>
                    <input type="number" class="form-input investment-input" placeholder="0">
                </div>
                <div class="input-group">
                    <label class="input-label">🎯 回収額 (円)</label>
                    <input type="number" class="form-input recovery-input" placeholder="0">
                </div>
            `;
            
            document.getElementById('memberInputs').appendChild(memberCard);
        }

        // メンバー削除
        function removeMember(memberId) {
            if (document.querySelectorAll('.member-card').length <= 2) {
                alert('メンバーは2人以上必要です！');
                return;
            }
            
            const element = document.getElementById(memberId);
            if (element) {
                element.remove();
                updateMemberNumbers();
            }
        }

        // メンバー番号を更新
        function updateMemberNumbers() {
            const cards = document.querySelectorAll('.member-card');
            memberCount = cards.length;
            
            cards.forEach((card, index) => {
                const memberNumber = index + 1;
                const nameInput = card.querySelector('.member-name-input');
                const nameDisplay = card.querySelector('.member-name');
                
                nameDisplay.textContent = `メンバー ${memberNumber}`;
                if (nameInput.value === `メンバー ${card.id.split('_')[1]}`) {
                    nameInput.value = `メンバー ${memberNumber}`;
                }
                
                // 削除ボタンの表示/非表示
                const removeBtn = card.querySelector('.remove-member');
                if (removeBtn) {
                    removeBtn.style.display = memberCount > 2 ? 'block' : 'none';
                }
            });
        }

        // 精算計算
        function calculateSettlement() {
            const members = [];
            let totalNet = 0; // 回収-投資の合計

            // メンバーデータを収集
            document.querySelectorAll('.member-card').forEach((card, index) => {
                const name = card.querySelector('.member-name-input').value || `メンバー ${index + 1}`;
                const investment = parseFloat(card.querySelector('.investment-input').value) || 0;
                const recovery = parseFloat(card.querySelector('.recovery-input').value) || 0;
                const net = recovery - investment; // 回収 - 投資
                
                members.push({
                    name,
                    investment,
                    recovery,
                    net,
                    originalIndex: index
                });
                
                totalNet += net;
            });

            if (members.length < 2) {
                alert('メンバーは2人以上必要です！');
                return;
            }

            // 平均値の計算（小数点以下切り捨て）
            const averageNet = Math.floor(totalNet / members.length);
            const remainder = totalNet - (averageNet * members.length); // 余り

            // 各メンバーの不足額/超過額を計算
            members.forEach(member => {
                member.shortage = averageNet - member.net; // 不足額（正の数なら受け取る、負の数なら支払う）
            });

            // 精算の流れを計算
            const settlements = calculateSettlements(members);

            // 結果を表示
            displaySettlementResult(members, totalNet, averageNet, remainder, settlements);
        }

        // 精算の流れを計算する関数
        function calculateSettlements(members) {
            const receivers = members.filter(m => m.shortage > 0)
                .sort((a, b) => b.shortage - a.shortage); // 不足額が多い順
            const payers = members.filter(m => m.shortage < 0)
                .sort((a, b) => a.shortage - b.shortage); // 超過額が多い順（不足額が小さい順）

            const settlements = [];
            let receiverIndex = 0;
            let payerIndex = 0;

            while (receiverIndex < receivers.length && payerIndex < payers.length) {
                const receiver = receivers[receiverIndex];
                const payer = payers[payerIndex];
                
                const amount = Math.min(receiver.shortage, Math.abs(payer.shortage));
                
                if (amount > 0) {
                    settlements.push({
                        from: payer.name,
                        to: receiver.name,
                        amount: amount
                    });
                    
                    receiver.shortage -= amount;
                    payer.shortage += amount;
                    
                    if (receiver.shortage === 0) receiverIndex++;
                    if (payer.shortage === 0) payerIndex++;
                }
            }

            return settlements;
        }

        // 精算結果を表示
        function displaySettlementResult(members, totalNet, averageNet, remainder, settlements) {
            const resultDiv = document.getElementById('settlementResult');
            
            let html = `
                <div class="result-item">
                    <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #118ab2;">📊 全体の状況</div>
                    <strong>全体の収支:</strong> ${totalNet.toLocaleString()}円<br>
                    <strong>参加人数:</strong> ${members.length}人<br>
                    <strong>1人あたりの収支:</strong> ${averageNet.toLocaleString()}円
                </div>
            `;

            // 余りの表示
            if (remainder !== 0) {
                html += `
                    <div class="remainder">
                        <strong>🎁 余り:</strong> ${remainder}円
                    </div>
                `;
            }

            // 各メンバーの状況表示
            html += `
                <div style="margin: 20px 0; border-top: 2px dashed #ffd166; padding-top: 20px;">
                    <div style="font-size: 1.1rem; font-weight: bold; color: #ff6b6b; margin-bottom: 15px;">👥 各メンバーの状況</div>
            `;

            members.forEach(member => {
                const status = member.net === averageNet ? '丁度' : 
                              member.net < averageNet ? '不足' : '超過';
                const amount = Math.abs(member.net - averageNet);
                const colorClass = member.net < averageNet ? 'negative' : 
                                  member.net > averageNet ? 'positive' : '';
                const emoji = member.net === averageNet ? '✅' : 
                             member.net < averageNet ? '📥' : '📤';
                
                html += `
                    <div class="payment-item">
                        <strong>${emoji} ${member.name}</strong><br>
                        💸 投資: ${member.investment.toLocaleString()}円 / 
                        🎯 回収: ${member.recovery.toLocaleString()}円<br>
                        📊 差額: ${member.net.toLocaleString()}円 → 
                        <span class="${colorClass}">${status} ${amount !== 0 ? amount.toLocaleString() + '円' : ''}</span>
                    </div>
                `;
            });

            html += `</div>`;

            // 精算の流れ表示
            if (settlements.length > 0) {
                html += `
                    <div style="margin: 25px 0; border-top: 2px dashed #ffd166; padding-top: 20px;">
                        <div style="font-size: 1.1rem; font-weight: bold; color: #06d6a0; margin-bottom: 15px;">🔄 精算の流れ</div>
                `;

                settlements.forEach((settlement, index) => {
                    html += `
                        <div class="payment-negative money-animation money-fly" id="payment-${index}">
                            <strong>${settlement.from}</strong> 
                            <span class="payment-arrow">➡️</span>
                            <strong>${settlement.to}</strong><br>
                            <span class="negative">💰 ${settlement.amount.toLocaleString()}円を支払う</span>
                        </div>
                    `;
                });

                html += `</div>`;
            }

            // 最終状態の表示
            html += `
                <div style="margin-top: 25px; padding: 20px; background: linear-gradient(135deg, rgba(255, 214, 102, 0.1), rgba(255, 214, 102, 0.05)); border-radius: 12px; border: 2px solid #ffd166;">
                    <div style="font-size: 1.1rem; font-weight: bold; color: #118ab2; margin-bottom: 10px;">🎉 精算完了！</div>
                    <strong>精算完了後の状態:</strong><br>
                    全員の収支が ${averageNet.toLocaleString()}円 になります
            `;

            if (remainder !== 0) {
                html += `<br><small>（余り ${remainder}円）</small>`;
            }

            html += `</div>`;

            resultDiv.innerHTML = html;

            // アニメーションを順番に再生
            settlements.forEach((settlement, index) => {
                setTimeout(() => {
                    const element = document.getElementById(`payment-${index}`);
                    if (element) {
                        element.classList.add('money-animation');
                    }
                }, index * 300);
            });
        }

        // 全クリア
        function clearAll() {
            if (confirm('すべての入力をクリアしますか？')) {
                document.querySelectorAll('.member-card').forEach(card => {
                    card.querySelector('.investment-input').value = '';
                    card.querySelector('.recovery-input').value = '';
                });
                document.getElementById('settlementResult').innerHTML = 
                    `<div style="text-align: center; color: #8d6e63; padding: 40px 20px;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">🤝</div>
                        <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">
                            メンバー情報を入力して「精算」を押してください
                        </div>
                    </div>`;
            }
        }

        // メニュー外をクリックしたらメニューを閉じる
        document.addEventListener('click', function(event) {
            const menuContainer = document.querySelector('.menu-container');
            const menuContent = document.getElementById('menuContent');
            if (!menuContainer.contains(event.target)) {
                menuContent.classList.remove('show');
            }
        });
    </script>
</body>
</html>
