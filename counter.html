<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カウンターアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    font-family: 'Rajdhani', 'Orbitron', sans-serif;
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #0a0a0a;
    color: #00ff00;
    overflow: hidden;
    transition: background-color 0.3s ease;
}

/* ボタン色に応じた背面色変化 - 明るい色に */
body.red-bg { background-color: #660000; }
body.green-bg { background-color: #006600; }
body.blue-bg { background-color: #000066; }
body.yellow-bg { background-color: #666600; }

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #1a1a1a;
    padding: 10px;
    border: 1px solid #00ff00;
    border-radius: 10px;
    min-height: 0;
}

.mode-buttons {
    display: flex;
    gap: 5px;
    margin-bottom: 15px;
    flex-shrink: 0;
}

.mode-btn {
    flex: 1;
    padding: 8px 3px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    min-height: 30px;
}

.mode-btn.active {
    background: #00ff00;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 10px #00ff00;
}

/* ゲームカウンターとボタンを並列に配置 */
.main-content {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* 左側：GAMEカウンター - 囲い線なし、入力フィールドが上 */
.game-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 100px;
    flex-shrink: 0;
}

.game-input {
    width: 100%;
    padding: 10px;
    border: 1px solid #00ff00;
    border-radius: 5px;
    text-align: center;
    font-size: 24px;
    background: #000000;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    margin-bottom: 8px;
}

.game-input:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 15px #00ff00;
}

.game-label {
    font-weight: 600;
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    font-size: 20px;
    white-space: nowrap;
}

/* 右側：丸いカウントボタン */
.circle-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex: 1;
    min-width: 0;
}

.circle-btn-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
}

/* カウントと分数の表示（ボタンの上） */
.count-display {
    font-size: 24px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 8px;
    font-weight: 700;
    line-height: 1.2;
}

.rate-display {
    font-size: 18px;
    color: #00ff00;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    opacity: 0.9;
    margin-bottom: 8px;
    font-weight: 600;
    line-height: 1.2;
}

.circle-btn {
    width: 60px;
    height: 60px;
    border: 2px solid;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

/* ボタン押下時のアニメーション - 発光効果強化 */
.circle-btn.pressed {
    transform: scale(0.85);
}

.circle-btn::after {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border: 3px solid #ffffff;
    border-radius: 50%;
    opacity: 0;
    transition: all 0.2s ease;
}

.circle-btn.pressed::after {
    opacity: 1;
    box-shadow: 
        0 0 20px #ffffff,
        0 0 40px #ffffff,
        inset 0 0 20px rgba(255, 255, 255, 0.3);
}

/* 各ボタンの色 - 発光色を個別に */
.circle-btn-1 {
    border-color: #ff0000;
    background: #ff0000;
    color: #000000;
}

.circle-btn-1.pressed::after {
    border-color: #ff4444;
    box-shadow: 
        0 0 25px #ff0000,
        0 0 50px #ff0000,
        inset 0 0 20px rgba(255, 255, 255, 0.4);
}

.circle-btn-2 {
    border-color: #00ff00;
    background: #00ff00;
    color: #000000;
}

.circle-btn-2.pressed::after {
    border-color: #44ff44;
    box-shadow: 
        0 0 25px #00ff00,
        0 0 50px #00ff00,
        inset 0 0 20px rgba(255, 255, 255, 0.4);
}

.circle-btn-3 {
    border-color: #0000ff;
    background: #0000ff;
    color: #ffffff;
}

.circle-btn-3.pressed::after {
    border-color: #4444ff;
    box-shadow: 
        0 0 25px #0000ff,
        0 0 50px #0000ff,
        inset 0 0 20px rgba(255, 255, 255, 0.4);
}

.circle-btn-4 {
    border-color: #ffff00;
    background: #ffff00;
    color: #000000;
}

.circle-btn-4.pressed::after {
    border-color: #ffff44;
    box-shadow: 
        0 0 25px #ffff00,
        0 0 50px #ffff00,
        inset 0 0 20px rgba(255, 255, 255, 0.4);
}

/* 制御ボタン - 画像に合わせて配置変更 */
.control-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-shrink: 0;
    align-items: center;
}

/* 増加ボタン - 黒い四角 */
.increment-btn {
    width: 60px;
    height: 60px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.3s ease;
    position: relative;
}

.increment-btn.active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

/* 減少ボタン - 黒い三角 */
.decrement-btn {
    width: 60px;
    height: 60px;
    border: 2px solid #ff0000;
    background: #000000;
    color: #ff0000;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.3s ease;
    position: relative;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    transform: rotate(180deg); /* 上向きの三角 */
}

.decrement-btn.active {
    background: #ff0000;
    color: #000000;
    box-shadow: 0 0 15px #ff0000;
}

/* リセットボタン - 位置調整 */
.reset-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    margin-left: auto;
    max-width: 120px;
}

.reset-btn.active {
    background: #00ff00;
    color: #000000;
    box-shadow: 0 0 15px #00ff00;
}

.control-btn.pressed {
    transform: scale(0.92);
}

/* 数字入力時のスピンボタンを非表示 */
.game-input::-webkit-outer-spin-button,
.game-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.game-input[type=number] {
    -moz-appearance: textfield;
}

/* スマホ用スタイル調整 - 高さの制限を緩和 */
@media (max-height: 700px) {
    .container {
        padding: 8px;
    }
    
    .mode-buttons {
        margin-bottom: 10px;
    }
    
    .main-content {
        margin-bottom: 10px;
        gap: 10px;
    }
    
    .control-buttons {
        margin-bottom: 10px;
    }
    
    .count-display {
        font-size: 20px;
        margin-bottom: 6px;
    }
    
    .rate-display {
        font-size: 16px;
        margin-bottom: 6px;
    }
    
    .circle-btn {
        width: 50px;
        height: 50px;
    }
    
    .game-section {
        min-width: 80px;
    }
    
    .game-label {
        font-size: 18px;
    }
    
    .game-input {
        font-size: 20px;
        padding: 8px;
    }
    
    /* 制御ボタンも小さく */
    .increment-btn, .decrement-btn {
        width: 50px;
        height: 50px;
        font-size: 20px;
    }
    
    .reset-btn {
        padding: 10px;
        font-size: 12px;
        max-width: 100px;
    }
}

/* 横向き用スタイル - さらにコンパクトに */
@media (orientation: landscape) and (max-height: 500px) {
    .container {
        padding: 5px;
    }
    
    .mode-buttons {
        margin-bottom: 5px;
    }
    
    .mode-btn {
        padding: 6px 2px;
        font-size: 10px;
        min-height: 25px;
    }
    
    .main-content {
        margin-bottom: 5px;
        gap: 8px;
    }
    
    .control-buttons {
        margin-bottom: 5px;
    }
    
    .count-display {
        font-size: 16px;
        margin-bottom: 4px;
    }
    
    .rate-display {
        font-size: 12px;
        margin-bottom: 4px;
    }
    
    .circle-btn {
        width: 40px;
        height: 40px;
    }
    
    .game-input {
        font-size: 16px;
        padding: 6px;
        margin-bottom: 4px;
    }
    
    .game-label {
        font-size: 14px;
    }
    
    /* 制御ボタンもさらに小さく */
    .increment-btn, .decrement-btn {
        width: 40px;
        height: 40px;
        font-size: 16px;
    }
    
    .reset-btn {
        padding: 8px;
        font-size: 10px;
        max-width: 80px;
    }
}

/* 超低画面用 */
@media (max-height: 400px) {
    .container {
        padding: 3px;
    }
    
    .mode-buttons {
        margin-bottom: 3px;
    }
    
    .main-content {
        margin-bottom: 3px;
        gap: 5px;
    }
    
    .control-buttons {
        margin-bottom: 3px;
    }
}

/* 確認ダイアログ用のオーバーレイ */
.confirm-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.confirm-dialog {
    background: #1a1a1a;
    border: 2px solid #00ff00;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    max-width: 280px;
    width: 90%;
    box-shadow: 0 0 30px #00ff00;
    margin: 10px;
}

.confirm-message {
    color: #00ff00;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 20px;
    font-size: 16px;
    font-weight: 600;
}

.confirm-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.confirm-btn {
    padding: 12px 20px;
    border: 2px solid #00ff00;
    background: #000000;
    color: #00ff00;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
    flex: 1;
    font-size: 14px;
}

.confirm-btn.yes {
    background: #004400;
    border-color: #00ff00;
}

.confirm-btn.yes:active {
    background: #00ff00;
    color: #000000;
    transform: scale(0.95);
}

.confirm-btn.no {
    background: #440000;
    border-color: #ff0000;
}

.confirm-btn.no:active {
    background: #ff0000;
    color: #000000;
    transform: scale(0.95);
}
</style>
</head>
<body>
<div class="container">
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="A">MODE A</button>
        <button class="mode-btn" data-mode="B">MODE B</button>
        <button class="mode-btn" data-mode="C">MODE C</button>
    </div>

    <!-- メインコンテンツ：GAMEカウンターとボタンを並列 -->
    <div class="main-content">
        <!-- 左側：GAMEカウンター - 入力フィールドが上 -->
        <div class="game-section">
            <input type="number" class="game-input" id="totalCount" value="0" min="0">
            <span class="game-label">GAME</span>
        </div>

        <!-- 右側：丸いカウントボタン -->
        <div class="circle-buttons">
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay1">0</div>
                <div class="rate-display" id="rateDisplay1">1/0.00</div>
                <button class="circle-btn circle-btn-1" data-index="0"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay2">0</div>
                <div class="rate-display" id="rateDisplay2">1/0.00</div>
                <button class="circle-btn circle-btn-2" data-index="1"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay3">0</div>
                <div class="rate-display" id="rateDisplay3">1/0.00</div>
                <button class="circle-btn circle-btn-3" data-index="2"></button>
            </div>
            <div class="circle-btn-container">
                <div class="count-display" id="countDisplay4">0</div>
                <div class="rate-display" id="rateDisplay4">1/0.00</div>
                <button class="circle-btn circle-btn-4" data-index="3"></button>
            </div>
        </div>
    </div>

    <!-- 制御ボタン - 画像に合わせて配置 -->
    <div class="control-buttons">
        <!-- 黒い四角 - 増加ボタン -->
        <button class="increment-btn active" id="incrementBtn">+</button>
        
        <!-- 黒い三角 - 減少ボタン -->
        <button class="decrement-btn" id="decrementBtn"></button>
        
        <!-- リセットボタン -->
        <button class="reset-btn" id="resetBtn">リセット</button>
    </div>
</div>

<script>
class CounterApp {
    constructor() {
        this.currentMode = 'A';
        this.isIncrementMode = true;
        
        // 各モードと各カウントボタンの値を保持
        this.counts = {
            'A': [0, 0, 0, 0],
            'B': [0, 0, 0, 0],
            'C': [0, 0, 0, 0]
        };
        
        // 各モードごとのG数を保持
        this.totalGames = {
            'A': 0,
            'B': 0,
            'C': 0
        };
        
        this.initializeElements();
        this.setupEventListeners();
        this.setMode('A');
        this.updateDisplay();
        
        // 画面回転時のリサイズ対応
        this.handleResize();
        window.addEventListener('resize', () => this.handleResize());
        window.addEventListener('orientationchange', () => this.handleResize());
    }

    initializeElements() {
        this.totalCountElement = document.getElementById('totalCount');
        this.modeButtons = document.querySelectorAll('.mode-btn');
        this.circleButtons = document.querySelectorAll('.circle-btn');
        this.incrementBtn = document.getElementById('incrementBtn');
        this.decrementBtn = document.getElementById('decrementBtn');
        this.resetBtn = document.getElementById('resetBtn');
        
        // カウント表示要素
        this.countDisplays = [
            document.getElementById('countDisplay1'),
            document.getElementById('countDisplay2'),
            document.getElementById('countDisplay3'),
            document.getElementById('countDisplay4')
        ];
        
        // レート表示要素
        this.rateDisplays = [
            document.getElementById('rateDisplay1'),
            document.getElementById('rateDisplay2'),
            document.getElementById('rateDisplay3'),
            document.getElementById('rateDisplay4')
        ];
    }

    handleResize() {
        // リサイズ時に少し遅延して実行
        setTimeout(() => {
            // 必要に応じて要素のサイズ調整
            const container = document.querySelector('.container');
            if (container) {
                container.style.minHeight = '0';
            }
        }, 100);
    }

    setupEventListeners() {
        // モードボタン
        this.modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.setMode(btn.dataset.mode);
            });
        });

        // 丸いカウントボタン
        this.circleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.handleButtonPress(btn, () => {
                    const index = parseInt(btn.dataset.index);
                    this.handleCountButton(index);
                });
            });
        });

        // 制御ボタン
        [this.incrementBtn, this.decrementBtn, this.resetBtn].forEach(btn => {
            btn.addEventListener('click', () => {
                this.handleButtonPress(btn, () => {
                    if (btn === this.incrementBtn) {
                        this.setIncrementMode(true);
                    } else if (btn === this.decrementBtn) {
                        this.setIncrementMode(false);
                    } else if (btn === this.resetBtn) {
                        this.showResetConfirmation();
                    }
                });
            });
        });

        // 総G数入力の変更を監視
        this.totalCountElement.addEventListener('change', () => {
            this.updateTotalGames();
            this.updateDisplay();
        });
    }

    handleButtonPress(button, callback) {
        // ボタン押下時の背面色変化
        if (button.classList.contains('circle-btn-1')) {
            document.body.classList.add('red-bg');
        } else if (button.classList.contains('circle-btn-2')) {
            document.body.classList.add('green-bg');
        } else if (button.classList.contains('circle-btn-3')) {
            document.body.classList.add('blue-bg');
        } else if (button.classList.contains('circle-btn-4')) {
            document.body.classList.add('yellow-bg');
        }
        
        // ボタン押下時の視覚的フィードバック
        button.classList.add('pressed');
        setTimeout(() => {
            button.classList.remove('pressed');
        }, 200);
        
        // 背面色を元に戻す
        setTimeout(() => {
            document.body.classList.remove('red-bg', 'green-bg', 'blue-bg', 'yellow-bg');
        }, 300);
        
        // コールバック実行
        setTimeout(callback, 50);
    }

    setMode(mode) {
        this.currentMode = mode;

        // アクティブなモードボタンのスタイル更新
        this.modeButtons.forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 現在のモードのG数を表示
        this.totalCountElement.value = this.totalGames[this.currentMode];
        
        this.updateDisplay();
    }

    setIncrementMode(isIncrement) {
        this.isIncrementMode = isIncrement;
        
        // ボタンのスタイル更新
        if (isIncrement) {
            this.incrementBtn.classList.add('active');
            this.decrementBtn.classList.remove('active');
        } else {
            this.incrementBtn.classList.remove('active');
            this.decrementBtn.classList.add('active');
        }
    }

    handleCountButton(buttonIndex) {
        const currentCounts = this.counts[this.currentMode];
        
        if (this.isIncrementMode) {
            currentCounts[buttonIndex]++;
        } else {
            if (currentCounts[buttonIndex] > 0) {
                currentCounts[buttonIndex]--;
            }
        }
        
        this.updateDisplay();
    }

    showResetConfirmation() {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        
        const dialog = document.createElement('div');
        dialog.className = 'confirm-dialog';
        
        const message = document.createElement('div');
        message.className = 'confirm-message';
        message.textContent = '全て消去しますがよろしいですか？';
        
        const buttons = document.createElement('div');
        buttons.className = 'confirm-buttons';
        
        const yesBtn = document.createElement('button');
        yesBtn.className = 'confirm-btn yes';
        yesBtn.textContent = 'はい';
        yesBtn.onclick = () => {
            this.resetCurrentMode();
            document.body.removeChild(overlay);
        };
        
        const noBtn = document.createElement('button');
        noBtn.className = 'confirm-btn no';
        noBtn.textContent = 'いいえ';
        noBtn.onclick = () => {
            document.body.removeChild(overlay);
        };
        
        buttons.appendChild(yesBtn);
        buttons.appendChild(noBtn);
        
        dialog.appendChild(message);
        dialog.appendChild(buttons);
        overlay.appendChild(dialog);
        
        document.body.appendChild(overlay);
    }

    resetCurrentMode() {
        this.counts[this.currentMode] = [0, 0, 0, 0];
        this.updateDisplay();
    }

    updateTotalGames() {
        let value = parseInt(this.totalCountElement.value);
        if (isNaN(value) || value < 0) {
            value = 0;
        }
        this.totalGames[this.currentMode] = value;
        this.totalCountElement.value = value;
        this.updateDisplay();
    }

    updateDisplay() {
        const currentCounts = this.counts[this.currentMode];
        const currentTotalGames = this.totalGames[this.currentMode];
        
        // 各カウントボタンの表示を更新
        this.countDisplays.forEach((element, index) => {
            element.textContent = currentCounts[index];
        });
        
        // レート表示を更新
        this.rateDisplays.forEach((element, index) => {
            const count = currentCounts[index];
            let rate = "1/0.00";
            
            if (count > 0 && currentTotalGames > 0) {
                const calculatedRate = currentTotalGames / count;
                rate = `1/${calculatedRate.toFixed(2)}`;
            } else if (count > 0) {
                rate = "1/0.00";
            }
            
            element.textContent = rate;
        });
    }
}

// アプリケーションの初期化
document.addEventListener('DOMContentLoaded', () => {
    new CounterApp();
});
</script>
